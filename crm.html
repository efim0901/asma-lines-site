<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Диспетчерская — ASMA Lines</title>
  <meta name="description" content="Диспетчерская система управления заявками и рейсами ASMA Lines">
  <meta name="theme-color" content="#121824">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/crm.css?v=20260917m">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/asma-mark.svg">
</head>
<body>

  <!-- Top Sticky Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="brand-badge">
          <svg width="22" height="22" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="8" fill="#6B1E2D"/>
            <path d="M12 28L20 12L28 28H23.5L20 20.5L16.5 28H12Z" fill="#FAF9F5"/>
            <path d="M15 25H25" stroke="#FAF9F5" stroke-width="2"/>
          </svg>
          <span class="brand-title">ASMA Lines</span>
          <span class="brand-sub">CRM</span>
        </div>
      </div>

      <div class="header-right">
        <!-- Single Operator Pill (Ivan only) -->
        <div class="operator-pill" id="operator-pill" title="Текущий диспетчер">
          <span class="status-dot"></span>
          <span class="operator-name">Иван</span>
        </div>

        <button id="btn-refresh" class="btn-icon" title="Обновить заявки" aria-label="Обновить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>

        <button id="btn-add-lead" class="btn-primary-compact">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          <span>Заявка</span>
        </button>
      </div>
    </div>

    <!-- Quick Search Bar -->
    <div class="search-row">
      <div class="search-input-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="lead-search" placeholder="Поиск: имя, телефон, город, #..." autocomplete="off">
        <button id="btn-clear-search" class="btn-clear" style="display:none;">✕</button>
      </div>
    </div>

    <!-- Segmented Status Tabs -->
    <nav class="tabs-nav" id="status-tabs" role="tablist">
      <button class="tab-item active" data-status="new" role="tab">
        <span>Новые</span>
        <span class="tab-count" id="count-new">0</span>
      </button>
      <button class="tab-item" data-status="processing" role="tab">
        <span>В работе</span>
        <span class="tab-count" id="count-processing">0</span>
      </button>
      <button class="tab-item" data-status="transit" role="tab">
        <span>В рейсе</span>
        <span class="tab-count" id="count-transit">0</span>
      </button>
      <button class="tab-item" data-status="completed" role="tab">
        <span>Завершены</span>
        <span class="tab-count" id="count-completed">0</span>
      </button>
      <button class="tab-item" data-status="all" role="tab">
        <span>Все</span>
        <span class="tab-count" id="count-all">0</span>
      </button>
    </nav>
  </header>

  <!-- Main Content Feed -->
  <main class="content-feed">

    <!-- Loading State -->
    <div id="feed-loading" class="feed-state">
      <div class="spinner"></div>
      <p>Загрузка заявок...</p>
    </div>

    <!-- Empty State -->
    <div id="feed-empty" class="feed-state" style="display: none;">
      <div class="empty-icon">📭</div>
      <h3 class="empty-title">В этой категории пока нет заявок</h3>
      <p class="empty-desc">Новые обращения с сайта или калькулятора появятся здесь автоматически.</p>
      <button class="btn-secondary" id="btn-empty-add">➕ Добавить заявку вручную</button>
    </div>

    <!-- Leads List -->
    <div id="leads-list" class="leads-list">
      <!-- Injected by crm.js -->
    </div>

  </main>

  <!-- MODAL: Add New Lead -->
  <div id="modal-add-lead" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Новая заявка</h3>
        <button class="btn-close modal-close-trigger">✕</button>
      </div>
      <form id="form-new-lead">
        <div class="modal-body">
          <div class="form-group">
            <label>Тип обращения:</label>
            <div class="type-selector">
              <label class="type-opt">
                <input type="radio" name="leadType" value="cargo" checked>
                <span>🚛 Перевозка груза</span>
              </label>
              <label class="type-opt">
                <input type="radio" name="leadType" value="contact">
                <span>📩 Звонок / Вопрос</span>
              </label>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Имя клиента / Фирма:</label>
              <input type="text" name="name" required placeholder="Напр. Дмитрий или ООО БелСнаб">
            </div>
            <div class="form-group">
              <label>Телефон:</label>
              <input type="tel" name="contact" required placeholder="+375 (29) ...">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Откуда:</label>
              <input type="text" name="fromCity" placeholder="Город погрузки (Минск)">
            </div>
            <div class="form-group">
              <label>Куда:</label>
              <input type="text" name="toCity" placeholder="Город выгрузки (Гомель)">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Транспорт / Вес:</label>
              <input type="text" name="vehicle" placeholder="Тент 10т / 8.5 т">
            </div>
            <div class="form-group">
              <label>Ставка (BYN):</label>
              <input type="text" name="price" placeholder="850 BYN">
            </div>
          </div>

          <div class="form-group">
            <label>Комментарий / Особые требования:</label>
            <textarea name="comment" rows="2" placeholder="Время погрузки, рампа, гидроборт..."></textarea>
          </div>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn-secondary modal-close-trigger">Отмена</button>
          <button type="submit" class="btn-primary">Сохранить заявку</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="/assets/crm.js?v=20260917m"></script>
</body>
</html>
