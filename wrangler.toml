# ASMA Lines — конфигурация Cloudflare Worker (продакшн).
#
# Проект развёрнут как Worker с ассетами (не Pages), имя скрипта: asma-lines-site
# Публичный адрес: https://asma-lines-site.firws.workers.dev
#
# Деплой: npx wrangler deploy
#
# Биндинг D1 обязателен: без него Worker работает только на чтение
# (данные из прежнего внешнего бина) и НЕ принимает заявки.
# Имя биндинга должно быть именно DB — Worker читает env.DB.

name = "asma-lines-site"
main = "_worker.js"

# Дата совместимости фиксирует поведение рантайма. Меняйте осознанно и проверяя сайт.
compatibility_date = "2025-09-23"

[assets]
directory = "."
binding = "ASSETS"

# Не отдаём index.html вместо несуществующих путей: Worker сам решает, что вернуть.
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "asma-lines"
database_id = "1acb05be-5bf6-4efc-bd11-41ff0509fb0e"
