<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="about_sky_c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A0D"/>
      <stop offset="40%" stop-color="#30131D"/>
      <stop offset="70%" stop-color="#4F1A29"/>
      <stop offset="100%" stop-color="#140A0E"/>
    </linearGradient>
    <linearGradient id="about_road_c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282025"/>
      <stop offset="100%" stop-color="#0E0B0D"/>
    </linearGradient>
    <pattern id="dot_grid_abt_c" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#E6A9B4" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1920" height="1080" fill="url(#about_sky_c)"/>
  <rect width="1920" height="1080" fill="url(#dot_grid_abt_c)"/>

  <!-- Centered Logistics Compass Rose (Visible in Mobile Center Crop) -->
  <g transform="translate(960, 420)" opacity="0.45">
    <circle cx="0" cy="0" r="320" stroke="#8B2536" stroke-width="3" fill="none"/>
    <circle cx="0" cy="0" r="230" stroke="#E6A9B4" stroke-width="2" fill="none" stroke-dasharray="12 10"/>
    <circle cx="0" cy="0" r="140" stroke="#FFC048" stroke-width="1.5" fill="none" opacity="0.6"/>
    <!-- Needles -->
    <polygon points="0,-300 24,-45 0,0 -24,-45" fill="#FF2E50"/>
    <polygon points="0,300 24,45 0,0 -24,45" fill="#6B1E2D"/>
    <polygon points="300,0 45,24 0,0 45,-24" fill="#6B1E2D"/>
    <polygon points="-300,0 -45,24 0,0 -45,-24" fill="#6B1E2D"/>
    <circle cx="0" cy="0" r="22" fill="#FFC048"/>
    <circle cx="0" cy="0" r="10" fill="#140A0D"/>
  </g>

  <!-- Highway Ribbon through Landscape -->
  <path d="M 0 660 Q 960 620 1920 580 L 1920 1080 L 0 1080 Z" fill="url(#about_road_c)"/>
  <path d="M 0 660 Q 960 620 1920 580" stroke="#8B2536" stroke-width="5"/>
  <path d="M 0 780 Q 960 740 1920 700" stroke="#E6A9B4" stroke-width="4" stroke-dasharray="60 40" opacity="0.5"/>
  <path d="M 0 920 Q 960 880 1920 840" stroke="#FFC048" stroke-width="3" opacity="0.35"/>

  <!-- Centered Logistics Truck (Spans x=680..1280) -->
  <g transform="translate(680, 480)">
    <!-- Shadow -->
    <ellipse cx="300" cy="270" rx="380" ry="24" fill="#030203" opacity="0.9"/>
    <!-- Headlight beam -->
    <polygon points="520,200 1020,130 1020,310 520,245" fill="#FFF8E0" fill-opacity="0.4"/>
    
    <!-- Trailer -->
    <rect x="0" y="30" width="380" height="195" rx="6" fill="#241E22" stroke="#4C3D46" stroke-width="2.5"/>
    <rect x="25" y="55" width="330" height="75" rx="4" fill="#140D10" stroke="#8B2536" stroke-width="2"/>
    <text x="45" y="100" fill="#F8F7EF" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="4">ASMA LINES</text>
    <text x="45" y="118" fill="#E6A9B4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">НАДЁЖНЫЙ ОПЕРАТОР · ГОМЕЛЬ</text>
    
    <!-- Trailer Wheels -->
    <circle cx="250" cy="245" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="310" cy="245" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="370" cy="245" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    
    <!-- Tractor Cab -->
    <path d="M 385 75 L 460 70 L 500 100 L 530 155 L 535 220 L 535 245 L 385 245 Z" fill="#8B2536" stroke="#E6A9B4" stroke-width="2"/>
    <path d="M 455 78 L 495 102 L 515 148 L 455 148 Z" fill="#18222A" stroke="#3A4D5C" stroke-width="2"/>
    <circle cx="525" cy="190" r="6" fill="#FFF8E0"/>
    <circle cx="525" cy="190" r="14" fill="#FFC048" fill-opacity="0.45"/>
    <!-- Tractor Wheels -->
    <circle cx="420" cy="245" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="505" cy="245" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
  </g>
</svg>
