<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ab_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E080B"/>
      <stop offset="35%" stop-color="#280E18"/>
      <stop offset="70%" stop-color="#4A1624"/>
      <stop offset="100%" stop-color="#12090C"/>
    </linearGradient>
    <radialGradient id="ab_glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B2536" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0E080B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ab_road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241B20"/>
      <stop offset="100%" stop-color="#0D090B"/>
    </linearGradient>
    <pattern id="ab_dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.3" fill="#E6A9B4" fill-opacity="0.15"/>
    </pattern>
    <filter id="ab_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1920" height="1080" fill="url(#ab_sky)"/>
  <rect width="1920" height="1080" fill="url(#ab_dots)"/>
  <rect width="1920" height="1080" fill="url(#ab_glow)"/>

  <!-- Centered Logistics Compass Rose / Geometry Rings -->
  <g transform="translate(960, 420)" opacity="0.4">
    <circle cx="0" cy="0" r="340" stroke="#8B2536" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="0" r="240" stroke="#E6A9B4" stroke-width="1.8" fill="none" stroke-dasharray="12 8"/>
    <circle cx="0" cy="0" r="150" stroke="#FFC048" stroke-width="1.2" fill="none"/>
    
    <!-- Compass Pointer Needles -->
    <polygon points="0,-320 22,-50 0,0 -22,-50" fill="#FF2E50"/>
    <polygon points="0,320 22,50 0,0 -22,50" fill="#6B1E2D"/>
    <polygon points="320,0 50,22 0,0 50,-22" fill="#6B1E2D"/>
    <polygon points="-320,0 -50,22 0,0 -50,-22" fill="#6B1E2D"/>
    
    <circle cx="0" cy="0" r="24" fill="#FFC048"/>
    <circle cx="0" cy="0" r="10" fill="#0E080B"/>
  </g>

  <!-- Highway Curve -->
  <path d="M 0 650 Q 960 600 1920 570 L 1920 1080 L 0 1080 Z" fill="url(#ab_road)"/>
  <path d="M 0 650 Q 960 600 1920 570" stroke="#8B2536" stroke-width="4.5"/>
  <path d="M 0 770 Q 960 720 1920 690" stroke="#FAF8F5" stroke-width="3.5" stroke-dasharray="60 40" opacity="0.45"/>
  <path d="M 0 920 Q 960 870 1920 840" stroke="#FFC048" stroke-width="2.5" opacity="0.4"/>

  <!-- Heavy Truck on Highway (Center Right) -->
  <g transform="translate(700, 470)" filter="url(#ab_shadow)">
    <!-- Shadow -->
    <ellipse cx="320" cy="275" rx="400" ry="22" fill="#000000" opacity="0.85"/>
    <!-- Headlight Cone -->
    <polygon points="540,205 1060,130 1060,320 540,250" fill="#FFF8E0" fill-opacity="0.45"/>

    <!-- Semi-Trailer Box -->
    <rect x="0" y="30" width="400" height="200" rx="6" fill="#221A1E" stroke="#4D3842" stroke-width="2.5"/>
    <rect x="25" y="55" width="350" height="80" rx="4" fill="#120A0D" stroke="#8B2536" stroke-width="2"/>
    <text x="45" y="102" fill="#FAF8F5" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="4">ASMA LINES</text>
    <text x="45" y="122" fill="#E6A9B4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">НАДЁЖНЫЙ ОПЕРАТОР · ГОМЕЛЬ</text>

    <!-- Wheels -->
    <g>
      <circle cx="260" cy="245" r="24" fill="#0C0A0B" stroke="#523E48" stroke-width="4"/>
      <circle cx="320" cy="245" r="24" fill="#0C0A0B" stroke="#523E48" stroke-width="4"/>
      <circle cx="380" cy="245" r="24" fill="#0C0A0B" stroke="#523E48" stroke-width="4"/>
    </g>

    <!-- Tractor Cab -->
    <path d="M395 245 L395 100 L425 65 L530 65 L555 110 L555 245 Z" fill="#6B1E2D" stroke="#8B2536" stroke-width="2"/>
    <path d="M460 75 L525 75 L545 110 L460 110 Z" fill="#1A2D38" stroke="#486272" stroke-width="1.5"/>
    <circle cx="450" cy="260" r="24" fill="#0C0A0B" stroke="#8B2536" stroke-width="5"/>
    <circle cx="530" cy="260" r="24" fill="#0C0A0B" stroke="#8B2536" stroke-width="5"/>
    <rect x="545" y="185" width="10" height="22" rx="2" fill="#FFFDF0"/>
  </g>
</svg>
