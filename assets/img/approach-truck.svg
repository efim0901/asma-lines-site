<svg width="1920" height="900" viewBox="0 0 1920 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="app_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140D10"/>
      <stop offset="40%" stop-color="#241118"/>
      <stop offset="75%" stop-color="#381620"/>
      <stop offset="100%" stop-color="#120A0E"/>
    </linearGradient>
    <linearGradient id="app_road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#221C20"/>
      <stop offset="100%" stop-color="#0D0A0C"/>
    </linearGradient>
    <linearGradient id="truck_burgundy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A1D2D"/>
      <stop offset="70%" stop-color="#B83A4E"/>
      <stop offset="100%" stop-color="#551520"/>
    </linearGradient>
    <linearGradient id="glow_beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFD199" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B2536" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="route_arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E50"/>
      <stop offset="50%" stop-color="#E6A9B4"/>
      <stop offset="100%" stop-color="#FFC048"/>
    </linearGradient>
    <pattern id="dot_grid_app" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.5" fill="#E6A9B4" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="900" fill="url(#app_bg)"/>
  <rect width="1920" height="900" fill="url(#dot_grid_app)"/>

  <!-- Centered Logistics Navigation Radar & Orbit Ring (Visible on both Desktop & Mobile) -->
  <g transform="translate(960, 430)" opacity="0.35">
    <circle cx="0" cy="0" r="340" stroke="#8B2536" stroke-width="2" stroke-dasharray="12 8" fill="none"/>
    <circle cx="0" cy="0" r="240" stroke="#E6A9B4" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="0" cy="0" r="140" stroke="#F8F7EF" stroke-width="1" stroke-dasharray="6 6" fill="none" opacity="0.4"/>
    <line x1="-380" y1="0" x2="380" y2="0" stroke="#8B2536" stroke-width="1.5"/>
    <line x1="0" y1="-380" x2="0" y2="380" stroke="#8B2536" stroke-width="1.5"/>
    <!-- Blips -->
    <circle cx="-160" cy="-80" r="7" fill="#FFC048"/>
    <circle cx="-160" cy="-80" r="15" stroke="#FFC048" stroke-width="1.5" fill="none" opacity="0.5"/>
    <circle cx="180" cy="70" r="7" fill="#E6A9B4"/>
    <circle cx="180" cy="70" r="15" stroke="#E6A9B4" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>

  <!-- Digital Route Waves -->
  <path d="M 0 520 Q 480 340 960 460 T 1920 380" fill="none" stroke="url(#route_arc)" stroke-width="3" opacity="0.55" stroke-dasharray="14 10"/>
  <path d="M 0 540 Q 480 360 960 480 T 1920 400" fill="none" stroke="#8B2536" stroke-width="1.5" opacity="0.4"/>

  <!-- Highway Surface (Spanning full width) -->
  <path d="M 0 600 Q 960 570 1920 540 L 1920 900 L 0 900 Z" fill="url(#app_road)"/>
  <path d="M 0 600 Q 960 570 1920 540" stroke="#423139" stroke-width="4"/>
  <path d="M 0 710 Q 960 680 1920 650" stroke="#E6A9B4" stroke-width="4" stroke-dasharray="50 35" opacity="0.4"/>
  <path d="M 0 840 Q 960 810 1920 780" stroke="#FFC048" stroke-width="2" opacity="0.3"/>

  <!-- Velocity Trails -->
  <path d="M 0 700 L 780 700" stroke="#FF2E50" stroke-width="6" opacity="0.75"/>
  <path d="M 0 708 L 680 708" stroke="#FF2E50" stroke-width="3" opacity="0.5"/>
  <path d="M 1240 650 L 1920 620" stroke="url(#glow_beam)" stroke-width="16" opacity="0.8"/>

  <!-- Perfectly Centered Heavy Logistics Truck (x: 680 - 1240, center at 960) -->
  <g transform="translate(680, 410)">
    <!-- Shadow -->
    <ellipse cx="280" cy="275" rx="360" ry="24" fill="#040304" opacity="0.88"/>

    <!-- Volumetric Headlight Cone -->
    <polygon points="560,195 1060,135 1060,320 560,250" fill="url(#glow_beam)" opacity="0.6"/>

    <!-- Semi-Trailer Body -->
    <rect x="0" y="30" width="410" height="200" rx="6" fill="#241E22" stroke="#483B43" stroke-width="2.5"/>
    <line x1="82" y1="30" x2="82" y2="230" stroke="#382E33" stroke-width="2"/>
    <line x1="164" y1="30" x2="164" y2="230" stroke="#382E33" stroke-width="2"/>
    <line x1="246" y1="30" x2="246" y2="230" stroke="#382E33" stroke-width="2"/>
    <line x1="328" y1="30" x2="328" y2="230" stroke="#382E33" stroke-width="2"/>

    <!-- Brand Emblem Plate on Trailer -->
    <rect x="25" y="60" width="360" height="75" rx="6" fill="#130D10" stroke="#8B2536" stroke-width="2"/>
    <text x="45" y="106" fill="#F8F7EF" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="5">ASMA LINES</text>
    <text x="46" y="124" fill="#E6A9B4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3">ПАРТНЁРСКАЯ СЕТЬ · БЕЛАРУСЬ</text>

    <!-- Trailer Underrun Frame & Triple Axle Wheels -->
    <rect x="50" y="230" width="180" height="20" rx="2" fill="#181315" stroke="#30262B" stroke-width="1.5"/>
    <!-- Wheels -->
    <circle cx="270" cy="245" r="24" fill="#0C0A0B" stroke="#45383F" stroke-width="4"/>
    <circle cx="270" cy="245" r="10" fill="#221A1E"/>
    <circle cx="328" cy="245" r="24" fill="#0C0A0B" stroke="#45383F" stroke-width="4"/>
    <circle cx="328" cy="245" r="10" fill="#221A1E"/>
    <circle cx="386" cy="245" r="24" fill="#0C0A0B" stroke="#45383F" stroke-width="4"/>
    <circle cx="386" cy="245" r="10" fill="#221A1E"/>

    <!-- Tractor Cab -->
    <path d="M 412 80 L 485 75 L 525 105 L 560 155 L 565 220 L 565 245 L 412 245 Z" fill="url(#truck_burgundy)" stroke="#D44D62" stroke-width="2"/>
    <path d="M 412 45 L 475 45 L 510 75 L 412 80 Z" fill="#5F1623" stroke="#8E293A" stroke-width="1.5"/>
    <!-- Windshield -->
    <path d="M 480 82 L 520 108 L 542 150 L 480 150 Z" fill="#18222A" stroke="#3A4D5C" stroke-width="2"/>
    <line x1="490" y1="90" x2="532" y2="140" stroke="#FFF" stroke-width="1.5" opacity="0.4"/>
    <!-- Side Window -->
    <path d="M 430 92 L 472 92 L 472 150 L 430 150 Z" fill="#18222A" stroke="#3A4D5C" stroke-width="1.5"/>
    <!-- Grille & Xenon Lights -->
    <rect x="545" y="170" width="18" height="40" rx="3" fill="#140D10" stroke="#4D222D" stroke-width="1.5"/>
    <circle cx="555" cy="185" r="5" fill="#FFF3D6"/>
    <circle cx="555" cy="185" r="11" fill="#FFC048" fill-opacity="0.45"/>
    <circle cx="555" cy="200" r="4" fill="#FFF3D6"/>
    <!-- Tractor Wheels -->
    <circle cx="450" cy="245" r="24" fill="#0C0A0B" stroke="#45383F" stroke-width="4"/>
    <circle cx="450" cy="245" r="10" fill="#221A1E"/>
    <circle cx="540" cy="245" r="24" fill="#0C0A0B" stroke="#45383F" stroke-width="4"/>
    <circle cx="540" cy="245" r="10" fill="#221A1E"/>
  </g>
</svg>
