<svg width="1920" height="800" viewBox="0 0 1920 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ap_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0709"/>
      <stop offset="40%" stop-color="#220B14"/>
      <stop offset="75%" stop-color="#3F121F"/>
      <stop offset="100%" stop-color="#0E070A"/>
    </linearGradient>
    <radialGradient id="ap_glow" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8B2536" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0C0709" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ap_road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E161A"/>
      <stop offset="100%" stop-color="#090607"/>
    </linearGradient>
    <linearGradient id="ap_beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFDF0" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FFE0A0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B2536" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ap_redtrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A44" stop-opacity="0"/>
      <stop offset="70%" stop-color="#FF2E50" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFA8B6" stop-opacity="1"/>
    </linearGradient>
    <pattern id="ap_dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.2" fill="#E6A9B4" fill-opacity="0.14"/>
    </pattern>
    <filter id="ap_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1920" height="800" fill="url(#ap_sky)"/>
  <rect width="1920" height="800" fill="url(#ap_dots)"/>
  <rect width="1920" height="800" fill="url(#ap_glow)"/>

  <!-- Highway Surface -->
  <path d="M 0 450 L 1920 450 L 1920 800 L 0 800 Z" fill="url(#ap_road)"/>
  <line x1="0" y1="448" x2="1920" y2="448" stroke="#8B2536" stroke-width="4"/>

  <!-- Road Dividers & Markings -->
  <path d="M 0 620 L 1920 620" stroke="#FAF8F5" stroke-width="4" stroke-dasharray="70 45" opacity="0.4"/>
  <line x1="0" y1="740" x2="1920" y2="740" stroke="#FFC048" stroke-width="3" opacity="0.45"/>

  <!-- Speed Motion Light Trails -->
  <path d="M -100 600 L 980 600" stroke="url(#ap_redtrail)" stroke-width="8"/>
  <path d="M -50 612 L 820 612" stroke="url(#ap_redtrail)" stroke-width="4"/>
  <path d="M 1380 570 L 2100 580" stroke="url(#ap_beam)" stroke-width="24" opacity="0.85"/>

  <!-- Semi-Trailer Truck (Center Right) -->
  <g transform="translate(1040, 280)" filter="url(#ap_shadow)">
    <!-- Volumetric Headlight Cone -->
    <polygon points="690,250 1380,160 1380,380 690,300" fill="url(#ap_beam)" opacity="0.6"/>

    <!-- Truck Shadow -->
    <ellipse cx="380" cy="315" rx="460" ry="24" fill="#000000" opacity="0.85"/>

    <!-- Semi-Trailer Box -->
    <rect x="0" y="30" width="500" height="240" rx="8" fill="#221B20" stroke="#4A3842" stroke-width="3"/>
    <rect x="35" y="60" width="430" height="90" rx="6" fill="#120A0D" stroke="#8B2536" stroke-width="2"/>
    <text x="60" y="112" fill="#FAF8F5" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="4">ASMA LINES</text>
    <text x="60" y="134" fill="#E6A9B4" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">НАШ ПОДХОД · 100% КООРДИНАЦИЯ</text>

    <!-- Wheels -->
    <g>
      <circle cx="340" cy="290" r="26" fill="#0C0A0B" stroke="#524049" stroke-width="5"/>
      <circle cx="400" cy="290" r="26" fill="#0C0A0B" stroke="#524049" stroke-width="5"/>
      <circle cx="460" cy="290" r="26" fill="#0C0A0B" stroke="#524049" stroke-width="5"/>
    </g>

    <!-- Tractor Cab -->
    <path d="M495 270 L495 120 L530 80 L660 80 L695 130 L695 270 Z" fill="#6B1E2D" stroke="#8B2536" stroke-width="2"/>
    <path d="M575 92 L655 92 L680 135 L575 135 Z" fill="#182A36" stroke="#4A6575" stroke-width="2"/>
    <circle cx="560" cy="290" r="28" fill="#0C0A0B" stroke="#682230" stroke-width="6"/>
    <circle cx="650" cy="290" r="28" fill="#0C0A0B" stroke="#682230" stroke-width="6"/>
    <rect x="682" y="215" width="12" height="26" rx="3" fill="#FFFDF0"/>
  </g>
</svg>
