<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hero_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A0D"/>
      <stop offset="35%" stop-color="#2D121B"/>
      <stop offset="65%" stop-color="#4F1A28"/>
      <stop offset="100%" stop-color="#1A0D12"/>
    </linearGradient>
    <linearGradient id="hero_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B2536" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8B2536" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="truck_body_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B2536"/>
      <stop offset="60%" stop-color="#BD334B"/>
      <stop offset="100%" stop-color="#641624"/>
    </linearGradient>
    <linearGradient id="road_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241C20"/>
      <stop offset="100%" stop-color="#0E0B0D"/>
    </linearGradient>
    <linearGradient id="light_beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFD382" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B2536" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neon_red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A44" stop-opacity="0"/>
      <stop offset="60%" stop-color="#FF1A44" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFA8B6" stop-opacity="1"/>
    </linearGradient>
    <pattern id="grid_dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#E6A9B4" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#hero_sky)"/>
  <rect width="1920" height="1080" fill="url(#grid_dots)"/>

  <!-- Atmosphere Radial Lights -->
  <circle cx="1200" cy="450" r="600" fill="url(#hero_glow)"/>
  <circle cx="500" cy="550" r="450" fill="url(#hero_glow)" opacity="0.6"/>

  <!-- Logistics Network Constellation Lines (Visible across screen) -->
  <g opacity="0.35" stroke="#E6A9B4" stroke-width="1.5">
    <circle cx="960" cy="380" r="280" stroke-dasharray="10 8" fill="none"/>
    <circle cx="960" cy="380" r="420" stroke-dasharray="4 6" fill="none" opacity="0.5"/>
    <line x1="300" y1="380" x2="1620" y2="380" stroke="#8B2536" stroke-width="2"/>
    <line x1="580" y1="200" x2="960" y2="380"/>
    <line x1="1340" y1="220" x2="960" y2="380"/>
  </g>

  <!-- Glowing Map Nodes -->
  <g transform="translate(680, 290)">
    <circle cx="0" cy="0" r="20" fill="#1A0D12" stroke="#FFC048" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="#FFC048"/>
    <text x="-32" y="-28" fill="#F8F7EF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">МИНСК</text>
  </g>
  <g transform="translate(1240, 260)">
    <circle cx="0" cy="0" r="24" fill="#1A0D12" stroke="#8B2536" stroke-width="4"/>
    <circle cx="0" cy="0" r="9" fill="#FF2E50"/>
    <text x="-34" y="-32" fill="#F8F7EF" font-family="system-ui, sans-serif" font-size="15" font-weight="900" letter-spacing="1">ГОМЕЛЬ · HUB</text>
  </g>

  <!-- Highway Surface (Spans full canvas width) -->
  <path d="M0 640 L1920 640 L1920 1080 L0 1080 Z" fill="url(#road_grad)"/>
  <line x1="0" y1="638" x2="1920" y2="638" stroke="#8B2536" stroke-width="5"/>
  <line x1="0" y1="648" x2="1920" y2="648" stroke="#3D3035" stroke-width="2"/>

  <!-- Dynamic Road Markings -->
  <path d="M0 830 L1920 830" stroke="#F8F7EF" stroke-width="4" stroke-dasharray="60 40" opacity="0.45"/>
  <line x1="0" y1="990" x2="1920" y2="990" stroke="#FFC048" stroke-width="3" opacity="0.5"/>

  <!-- High-Speed Light Trails -->
  <path d="M-100 810 L880 810" stroke="url(#neon_red)" stroke-width="8"/>
  <path d="M-50 822 L720 822" stroke="url(#neon_red)" stroke-width="4"/>
  <path d="M1380 770 L2100 780" stroke="url(#light_beam)" stroke-width="22" opacity="0.85"/>

  <!-- Heavy Duty Semi-Truck (Positioned on the right so mobile text on left has completely clean dark background) -->
  <g transform="translate(1050, 470)">
    <!-- Headlight volumetric cone on asphalt -->
    <polygon points="680,240 1340,160 1340,360 680,290" fill="url(#light_beam)" opacity="0.65"/>

    <!-- Truck Shadow -->
    <ellipse cx="360" cy="305" rx="440" ry="28" fill="#030203" opacity="0.9"/>

    <!-- Semi-Trailer (Euro Box) -->
    <rect x="0" y="35" width="480" height="230" rx="6" fill="#221C20" stroke="#483A42" stroke-width="3"/>
    
    <!-- Ribs -->
    <line x1="96" y1="35" x2="96" y2="265" stroke="#32282E" stroke-width="2"/>
    <line x1="192" y1="35" x2="192" y2="265" stroke="#32282E" stroke-width="2"/>
    <line x1="288" y1="35" x2="288" y2="265" stroke="#32282E" stroke-width="2"/>
    <line x1="384" y1="35" x2="384" y2="265" stroke="#32282E" stroke-width="2"/>

    <!-- Trailer Underrun Frame & Triple Axles -->
    <rect x="60" y="265" width="220" height="24" rx="2" fill="#161214" stroke="#362B31" stroke-width="2"/>
    <!-- Triple Axle Wheels -->
    <circle cx="330" cy="285" r="26" fill="#0C0A0B" stroke="#50424A" stroke-width="4"/>
    <circle cx="330" cy="285" r="11" fill="#241B20"/>
    <circle cx="395" cy="285" r="26" fill="#0C0A0B" stroke="#50424A" stroke-width="4"/>
    <circle cx="395" cy="285" r="11" fill="#241B20"/>
    <circle cx="460" cy="285" r="26" fill="#0C0A0B" stroke="#50424A" stroke-width="4"/>
    <circle cx="460" cy="285" r="11" fill="#241B20"/>

    <!-- Tractor Cab (Aerodynamic Burgundy Prime-Mover) -->
    <path d="M485 85 L575 80 L625 115 L665 175 L675 250 L675 285 L485 285 Z" fill="url(#truck_body_grad)" stroke="#E6A9B4" stroke-width="2.5"/>
    <path d="M485 45 L560 45 L605 85 L485 88 Z" fill="#601624" stroke="#9E253B" stroke-width="2"/>
    <!-- Windshield -->
    <path d="M570 90 L618 120 L646 170 L570 170 Z" fill="#17232B" stroke="#3C5160" stroke-width="2.5"/>
    <line x1="582" y1="98" x2="634" y2="158" stroke="#FFF" stroke-width="2" opacity="0.45"/>
    <!-- Side Window -->
    <path d="M508 102 L558 102 L558 170 L508 170 Z" fill="#17232B" stroke="#3C5160" stroke-width="2"/>

    <!-- Grille & Xenon Headlight Cluster -->
    <rect x="650" y="195" width="22" height="46" rx="3" fill="#130D10" stroke="#4F1C27" stroke-width="2"/>
    <circle cx="664" cy="212" r="6" fill="#FFF8E0"/>
    <circle cx="664" cy="212" r="14" fill="#FFC048" fill-opacity="0.5"/>
    <circle cx="664" cy="230" r="5" fill="#FFF8E0"/>

    <!-- Tractor Wheels -->
    <circle cx="535" cy="285" r="26" fill="#0C0A0B" stroke="#50424A" stroke-width="4"/>
    <circle cx="535" cy="285" r="11" fill="#241B20"/>
    <circle cx="645" cy="285" r="26" fill="#0C0A0B" stroke="#50424A" stroke-width="4"/>
    <circle cx="645" cy="285" r="11" fill="#241B20"/>
  </g>
</svg>
