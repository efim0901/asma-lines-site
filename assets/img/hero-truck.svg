<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190F12"/>
      <stop offset="35%" stop-color="#2D131A"/>
      <stop offset="70%" stop-color="#4A1822"/>
      <stop offset="100%" stop-color="#140C0E"/>
    </linearGradient>
    <linearGradient id="truck_burgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B2536"/>
      <stop offset="60%" stop-color="#601622"/>
      <stop offset="100%" stop-color="#3D0C13"/>
    </linearGradient>
    <linearGradient id="trailer_mat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C282A"/>
      <stop offset="100%" stop-color="#1A1819"/>
    </linearGradient>
    <linearGradient id="road_asphalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161415"/>
      <stop offset="100%" stop-color="#0D0C0D"/>
    </linearGradient>
    <linearGradient id="headlight_beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF5D6" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#FFD6A5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E6A9B4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="taillight_trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A4D" stop-opacity="0"/>
      <stop offset="70%" stop-color="#FF2A4D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF3355" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Sky & Atmosphere -->
  <rect width="1920" height="1080" fill="url(#sky_grad)"/>

  <!-- Distant Belarusian Forest Silhouette & Horizon -->
  <path d="M0 640 L120 635 L280 642 L460 630 L640 638 L850 628 L1040 636 L1280 625 L1500 634 L1720 628 L1920 638 L1920 720 L0 720 Z" fill="#181014" opacity="0.85"/>
  <path d="M0 660 L200 655 L420 662 L700 650 L980 658 L1240 648 L1540 656 L1920 650 L1920 740 L0 740 Z" fill="#140E10"/>

  <!-- Modern Highway Perspective -->
  <path d="M0 720 L1920 720 L1920 1080 L0 1080 Z" fill="url(#road_asphalt)"/>
  <!-- Safety Guardrail / Barrier -->
  <line x1="0" y1="718" x2="1920" y2="718" stroke="#3D3236" stroke-width="4"/>
  <line x1="0" y1="726" x2="1920" y2="726" stroke="#2B2225" stroke-width="2"/>

  <!-- Highway Lane Markings with Perspective -->
  <path d="M0 910 L1920 910" stroke="#F5F1E7" stroke-width="4" stroke-dasharray="70 45" opacity="0.3"/>
  <line x1="0" y1="738" x2="1920" y2="738" stroke="#F5F1E7" stroke-width="2" opacity="0.25"/>
  <line x1="0" y1="1040" x2="1920" y2="1040" stroke="#E6A9B4" stroke-width="3" opacity="0.35"/>

  <!-- Light speed trails / Logistics Velocity -->
  <path d="M-100 890 L980 890" stroke="url(#taillight_trail)" stroke-width="5"/>
  <path d="M-50 905 L820 905" stroke="url(#taillight_trail)" stroke-width="3"/>
  <path d="M1280 840 L2100 860" stroke="url(#headlight_beam)" stroke-width="12" opacity="0.6"/>

  <!-- Heavy Duty Modern Long-Haul Semi-Truck & Trailer -->
  <g transform="translate(720, 480)">
    <!-- Headlight volumetric cone on highway -->
    <polygon points="560,260 1200,210 1200,340 560,285" fill="url(#headlight_beam)" opacity="0.4"/>

    <!-- Cast Truck Shadow -->
    <ellipse cx="280" cy="310" rx="380" ry="24" fill="#050405" opacity="0.75"/>

    <!-- Semi-Trailer (Euro-Standard Curtain-Sider / Box) -->
    <rect x="0" y="40" width="410" height="230" rx="6" fill="url(#trailer_mat)" stroke="#3E383B" stroke-width="2.5"/>

    <!-- ASMA Lines Branding on Trailer -->
    <rect x="25" y="65" width="360" height="85" rx="4" fill="#141113" opacity="0.8"/>
    <text x="45" y="118" fill="#F8F7EF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="6">ASMA</text>
    <text x="195" y="118" fill="#E6A9B4" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="3">LINES</text>
    <text x="46" y="138" fill="#A89E9B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2">LOGISTICS · BELARUS</text>

    <!-- Trailer Vertical Ribs & Stanchions -->
    <line x1="85" y1="40" x2="85" y2="270" stroke="#3D3438" stroke-width="1.5"/>
    <line x1="170" y1="40" x2="170" y2="270" stroke="#3D3438" stroke-width="1.5"/>
    <line x1="255" y1="40" x2="255" y2="270" stroke="#3D3438" stroke-width="1.5"/>
    <line x1="340" y1="40" x2="340" y2="270" stroke="#3D3438" stroke-width="1.5"/>

    <!-- Trailer Underrun Protection / Pallet Box -->
    <rect x="50" y="270" width="180" height="24" rx="2" fill="#1C181A" stroke="#2B2427" stroke-width="1.5"/>
    <!-- Trailer Triple Axles -->
    <circle cx="280" cy="285" r="25" fill="#100E10" stroke="#42393D" stroke-width="4"/>
    <circle cx="280" cy="285" r="10" fill="#241E22"/>
    <circle cx="338" cy="285" r="25" fill="#100E10" stroke="#42393D" stroke-width="4"/>
    <circle cx="338" cy="285" r="10" fill="#241E22"/>
    <circle cx="396" cy="285" r="25" fill="#100E10" stroke="#42393D" stroke-width="4"/>
    <circle cx="396" cy="285" r="10" fill="#241E22"/>

    <!-- Tractor Unit (Sleek European Aerodynamic Cab) -->
    <!-- Cab Body -->
    <path d="M415 90 L490 85 L530 115 L565 170 L570 250 L570 280 L415 280 Z" fill="url(#truck_burgundy)" stroke="#A33246" stroke-width="2"/>
    <!-- Cab High Roof Deflector -->
    <path d="M415 50 L480 50 L515 85 L415 90 Z" fill="#6B1E2D" stroke="#A33246" stroke-width="1.5"/>
    <!-- Windshield -->
    <path d="M485 92 L524 118 L548 165 L485 165 Z" fill="#1B2228" stroke="#38454F" stroke-width="2"/>
    <line x1="495" y1="100" x2="538" y2="155" stroke="#FFF" stroke-width="1.5" opacity="0.3"/>
    <!-- Side Window -->
    <path d="M435 105 L475 105 L475 165 L435 165 Z" fill="#1B2228" stroke="#38454F" stroke-width="1.5"/>

    <!-- Grille & Headlamp Cluster -->
    <rect x="548" y="195" width="20" height="42" rx="3" fill="#1A1316" stroke="#473138" stroke-width="1.5"/>
    <circle cx="560" cy="210" r="4" fill="#FFEAA7"/>
    <circle cx="560" cy="225" r="3" fill="#FFEAA7"/>
    <!-- Front Bumper & Steps -->
    <path d="M540 248 L575 252 L572 278 L535 278 Z" fill="#2E1C22"/>

    <!-- Tractor Wheels -->
    <circle cx="455" cy="285" r="25" fill="#100E10" stroke="#42393D" stroke-width="4"/>
    <circle cx="455" cy="285" r="10" fill="#241E22"/>
    <circle cx="550" cy="285" r="25" fill="#100E10" stroke="#42393D" stroke-width="4"/>
    <circle cx="550" cy="285" r="10" fill="#241E22"/>

    <!-- Aerodynamic Side Skirts -->
    <rect x="485" y="260" width="40" height="24" rx="2" fill="#501620"/>
  </g>

  <!-- Route Waypoint Overlay Badge -->
  <g transform="translate(1520, 120)">
    <rect width="280" height="88" rx="14" fill="#1E1418" stroke="#4F232E" stroke-width="2"/>
    <circle cx="36" cy="34" r="8" fill="#8B2536"/>
    <circle cx="36" cy="34" r="4" fill="#F8F7EF"/>
    <line x1="36" y1="44" x2="36" y2="56" stroke="#E6A9B4" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="36" cy="64" r="5" fill="#E6A9B4"/>
    <text x="58" y="38" fill="#F8F7EF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">ГОМЕЛЬ · БЕЛАРУСЬ</text>
    <text x="58" y="62" fill="#E6A9B4" font-family="system-ui, -apple-system, sans-serif" font-size="12">Транспорт под задачу</text>
  </g>
</svg>
