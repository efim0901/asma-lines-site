<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="st_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E080B"/>
      <stop offset="35%" stop-color="#260C16"/>
      <stop offset="70%" stop-color="#461423"/>
      <stop offset="100%" stop-color="#10080B"/>
    </linearGradient>
    <radialGradient id="st_glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B2536" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0E080B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st_road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22191E"/>
      <stop offset="100%" stop-color="#0C080A"/>
    </linearGradient>
    <pattern id="st_dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.2" fill="#E6A9B4" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1920" height="1080" fill="url(#st_sky)"/>
  <rect width="1920" height="1080" fill="url(#st_dots)"/>
  <rect width="1920" height="1080" fill="url(#st_glow)"/>

  <!-- Analytical Growth Vector Charts & Milestone Markers -->
  <g opacity="0.4" stroke="#E6A9B4" stroke-width="1.8">
    <path d="M 200 500 L 500 420 L 800 460 L 1100 320 L 1400 360 L 1720 220" fill="none" stroke="#FF2E50" stroke-width="3"/>
    <path d="M 200 500 L 500 420 L 800 460 L 1100 320 L 1400 360 L 1720 220 L 1720 620 L 200 620 Z" fill="#8B2536" fill-opacity="0.15" stroke="none"/>
    
    <!-- Milestone Nodes -->
    <circle cx="500" cy="420" r="6" fill="#FFC048"/>
    <circle cx="800" cy="460" r="6" fill="#FFC048"/>
    <circle cx="1100" cy="320" r="8" fill="#FF2E50"/>
    <circle cx="1400" cy="360" r="6" fill="#FFC048"/>
    <circle cx="1720" cy="220" r="10" fill="#FF2E50"/>
  </g>

  <!-- Highway Ground Surface -->
  <path d="M 0 620 L 1920 620 L 1920 1080 L 0 1080 Z" fill="url(#st_road)"/>
  <line x1="0" y1="618" x2="1920" y2="618" stroke="#8B2536" stroke-width="4"/>

  <!-- Road Markings -->
  <path d="M 0 810 L 1920 810" stroke="#FAF8F5" stroke-width="4" stroke-dasharray="65 40" opacity="0.4"/>
  <line x1="0" y1="970" x2="1920" y2="970" stroke="#FFC048" stroke-width="3" opacity="0.45"/>
</svg>
