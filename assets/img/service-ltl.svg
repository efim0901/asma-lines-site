<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_ltl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1817"/>
      <stop offset="50%" stop-color="#2B1A1E"/>
      <stop offset="100%" stop-color="#141213"/>
    </linearGradient>
    <linearGradient id="pallet_wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#806854"/>
      <stop offset="100%" stop-color="#544336"/>
    </linearGradient>
    <linearGradient id="box_craft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C7F68"/>
      <stop offset="100%" stop-color="#6E5644"/>
    </linearGradient>
    <linearGradient id="box_burgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B2536"/>
      <stop offset="100%" stop-color="#5E1823"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg_ltl)"/>

  <!-- Warehouse Terminal Racks (Isometric/Perspective background) -->
  <g opacity="0.15" stroke="#F5F1E7" stroke-width="1.5">
    <!-- Tall vertical uprights -->
    <line x1="80" y1="80" x2="80" y2="700"/>
    <line x1="280" y1="80" x2="280" y2="700"/>
    <line x1="480" y1="80" x2="480" y2="700"/>
    <line x1="680" y1="80" x2="680" y2="700"/>
    <line x1="880" y1="80" x2="880" y2="700"/>
    <line x1="1080" y1="80" x2="1080" y2="700"/>

    <!-- Horizontal beam levels -->
    <line x1="60" y1="200" x2="1100" y2="200"/>
    <line x1="60" y1="360" x2="1100" y2="360"/>
    <line x1="60" y1="520" x2="1100" y2="520"/>
  </g>

  <!-- Warehouse floor -->
  <rect y="580" width="1280" height="220" fill="#151314"/>
  <line x1="0" y1="580" x2="1280" y2="580" stroke="#382E32" stroke-width="2"/>
  <!-- Floor lane markings -->
  <path d="M120 780 L280 580" stroke="#E6A9B4" stroke-width="2" stroke-dasharray="12 12" opacity="0.3"/>
  <path d="M520 780 L600 580" stroke="#E6A9B4" stroke-width="2" stroke-dasharray="12 12" opacity="0.3"/>

  <!-- European Pallet #1 (Left, small box consolidated) -->
  <g transform="translate(180, 410)">
    <!-- Wooden Pallet Base -->
    <rect x="0" y="140" width="220" height="12" rx="2" fill="url(#pallet_wood)"/>
    <rect x="15" y="152" width="30" height="18" fill="#423429"/>
    <rect x="95" y="152" width="30" height="18" fill="#423429"/>
    <rect x="175" y="152" width="30" height="18" fill="#423429"/>
    <rect x="0" y="170" width="220" height="8" rx="2" fill="url(#pallet_wood)"/>
    <!-- Boxes -->
    <rect x="15" y="40" width="190" height="100" rx="4" fill="url(#box_craft)" stroke="#4A3B2F" stroke-width="1.5"/>
    <rect x="35" y="60" width="50" height="30" rx="2" fill="#F5F1E7" opacity="0.85"/>
    <!-- Barcode lines -->
    <line x1="42" y1="67" x2="42" y2="83" stroke="#111" stroke-width="2"/>
    <line x1="47" y1="67" x2="47" y2="83" stroke="#111" stroke-width="1.5"/>
    <line x1="52" y1="67" x2="52" y2="83" stroke="#111" stroke-width="3"/>
    <line x1="58" y1="67" x2="58" y2="83" stroke="#111" stroke-width="1"/>
    <line x1="63" y1="67" x2="63" y2="83" stroke="#111" stroke-width="2"/>
    <line x1="68" y1="67" x2="68" y2="83" stroke="#111" stroke-width="2"/>
    <!-- Strapping Band -->
    <line x1="70" y1="40" x2="70" y2="140" stroke="#8B2536" stroke-width="2"/>
    <line x1="150" y1="40" x2="150" y2="140" stroke="#8B2536" stroke-width="2"/>
  </g>

  <!-- Central Pallet Stack (Hero LTL Shipment with shrink wrap & ASMA label) -->
  <g transform="translate(460, 260)">
    <!-- Wooden Pallet Base -->
    <rect x="0" y="290" width="340" height="16" rx="3" fill="url(#pallet_wood)"/>
    <rect x="25" y="306" width="40" height="22" fill="#3D3025"/>
    <rect x="150" y="306" width="40" height="22" fill="#3D3025"/>
    <rect x="275" y="306" width="40" height="22" fill="#3D3025"/>
    <rect x="0" y="328" width="340" height="10" rx="2" fill="url(#pallet_wood)"/>

    <!-- Bottom Tier Boxes -->
    <rect x="15" y="160" width="145" height="130" rx="4" fill="url(#box_craft)" stroke="#4E3A2C" stroke-width="1.5"/>
    <rect x="175" y="160" width="150" height="130" rx="4" fill="url(#box_craft)" stroke="#4E3A2C" stroke-width="1.5"/>

    <!-- Top Tier Hero ASMA Burgundy Box -->
    <rect x="40" y="40" width="260" height="120" rx="6" fill="url(#box_burgundy)" stroke="#B83A4E" stroke-width="2"/>
    <text x="65" y="76" fill="#F5F1E7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">ASMA CONSOLIDATION</text>
    <text x="65" y="98" fill="#E6A9B4" font-family="monospace" font-size="12">PARCEL #BY-GML-8924</text>
    <!-- Shipping Label -->
    <rect x="210" y="55" width="70" height="75" rx="3" fill="#F5F1E7"/>
    <rect x="220" y="65" width="50" height="20" fill="#EAE5D8"/>
    <line x1="220" y1="95" x2="270" y2="95" stroke="#222" stroke-width="2"/>
    <line x1="220" y1="102" x2="260" y2="102" stroke="#222" stroke-width="2"/>
    <line x1="220" y1="110" x2="265" y2="110" stroke="#8B2536" stroke-width="3"/>

    <!-- Semi-transparent Protective Shrink-wrap effect -->
    <rect x="10" y="35" width="320" height="258" rx="8" fill="#F5F1E7" opacity="0.06" stroke="#F5F1E7" stroke-width="1.5" stroke-dasharray="8 6"/>
  </g>

  <!-- Modern Electric Forklift Silhouette (Right side) -->
  <g transform="translate(860, 360)">
    <!-- Forklift Mast -->
    <rect x="30" y="30" width="14" height="250" fill="#2E2829" stroke="#4A3D40" stroke-width="2"/>
    <rect x="55" y="30" width="14" height="250" fill="#2E2829" stroke="#4A3D40" stroke-width="2"/>
    <!-- Forks Carriage -->
    <rect x="20" y="160" width="60" height="20" fill="#8B2536"/>
    <!-- Forks tines -->
    <path d="M15 175 L-60 175 L-60 185 L15 185 Z" fill="#4A3D40"/>
    <!-- Cab Cage -->
    <path d="M90 60 L180 60 L240 160 L240 250 L90 250 Z" fill="none" stroke="#665357" stroke-width="5"/>
    <rect x="100" y="150" width="150" height="110" rx="14" fill="#8B2536" stroke="#B83A4E" stroke-width="2"/>
    <!-- Wheel -->
    <circle cx="95" cy="265" r="26" fill="#181516" stroke="#423538" stroke-width="5"/>
    <circle cx="215" cy="265" r="24" fill="#181516" stroke="#423538" stroke-width="5"/>
  </g>

  <!-- Vector Route Indicator Badge -->
  <g transform="translate(900, 100)">
    <rect width="280" height="92" rx="14" fill="#231C1E" stroke="#4A2A30" stroke-width="1.5"/>
    <circle cx="34" cy="35" r="8" fill="#8B2536"/>
    <circle cx="34" cy="35" r="4" fill="#F5F1E7"/>
    <line x1="34" y1="45" x2="34" y2="57" stroke="#E6A9B4" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="34" cy="65" r="5" fill="#E6A9B4"/>
    <text x="56" y="39" fill="#F5F1E7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">СБОРНЫЕ ГРУЗЫ (LTL)</text>
    <text x="56" y="62" fill="#E6A9B4" font-family="system-ui, -apple-system, sans-serif" font-size="12">От 1 паллеты · Консолидация</text>
  </g>
</svg>
