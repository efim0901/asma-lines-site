<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sl_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E080B"/>
      <stop offset="45%" stop-color="#280C16"/>
      <stop offset="85%" stop-color="#481423"/>
      <stop offset="100%" stop-color="#10080B"/>
    </linearGradient>
    <linearGradient id="sl_floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22181D"/>
      <stop offset="100%" stop-color="#0B0709"/>
    </linearGradient>
    <linearGradient id="sl_box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1E2D"/>
      <stop offset="100%" stop-color="#4E1521"/>
    </linearGradient>
    <linearGradient id="sl_box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A26838"/>
      <stop offset="100%" stop-color="#5E381A"/>
    </linearGradient>
    <filter id="sl_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sl_bg)"/>

  <!-- Warehouse Terminal Background Racks -->
  <g stroke="#3D2831" stroke-width="2" opacity="0.6">
    <line x1="100" y1="180" x2="1100" y2="180"/>
    <line x1="100" y1="320" x2="1100" y2="320"/>
    <line x1="200" y1="120" x2="200" y2="480"/>
    <line x1="500" y1="120" x2="500" y2="480"/>
    <line x1="800" y1="120" x2="800" y2="480"/>
  </g>

  <!-- Warehouse Floor -->
  <path d="M 0 480 L 1200 480 L 1200 800 L 0 800 Z" fill="url(#sl_floor)"/>
  <line x1="0" y1="478" x2="1200" y2="478" stroke="#8B2536" stroke-width="4"/>

  <!-- Stacked Pallets and Consolidated Cargo Boxes -->
  <g transform="translate(300, 320)" filter="url(#sl_shadow)">
    <!-- Wooden Pallet Base -->
    <rect x="0" y="220" width="220" height="24" rx="2" fill="#422915" stroke="#7A4222" stroke-width="2"/>
    <rect x="20" y="224" width="30" height="16" fill="#1C110B"/>
    <rect x="95" y="224" width="30" height="16" fill="#1C110B"/>
    <rect x="170" y="224" width="30" height="16" fill="#1C110B"/>

    <!-- Large Cargo Box 1 (Burgundy Brand Box) -->
    <rect x="10" y="60" width="200" height="160" rx="4" fill="url(#sl_box1)" stroke="#8B2536" stroke-width="2"/>
    <!-- Barcode Label -->
    <rect x="30" y="90" width="60" height="40" fill="#FAF8F5"/>
    <line x1="40" y1="98" x2="40" y2="122" stroke="#120A0D" stroke-width="2"/>
    <line x1="45" y1="98" x2="45" y2="122" stroke="#120A0D" stroke-width="3"/>
    <line x1="52" y1="98" x2="52" y2="122" stroke="#120A0D" stroke-width="1"/>
    <line x1="58" y1="98" x2="58" y2="122" stroke="#120A0D" stroke-width="4"/>
    <line x1="68" y1="98" x2="68" y2="122" stroke="#120A0D" stroke-width="2"/>
    <text x="30" y="152" fill="#FAF8F5" font-family="system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="1">LTL / СБОРНЫЙ ГРУЗ</text>
    <text x="30" y="170" fill="#E6A9B4" font-family="system-ui, sans-serif" font-size="10" font-weight="700">ПАРТИЯ № ASMA-8840</text>
  </g>

  <!-- Stacked Pallet 2 (Kraft Box Stack) -->
  <g transform="translate(560, 360)" filter="url(#sl_shadow)">
    <!-- Wooden Pallet Base -->
    <rect x="0" y="180" width="180" height="20" rx="2" fill="#422915" stroke="#7A4222" stroke-width="2"/>
    
    <!-- Medium Kraft Boxes -->
    <rect x="10" y="70" width="160" height="110" rx="3" fill="url(#sl_box2)" stroke="#8C5832" stroke-width="2"/>
    <rect x="25" y="90" width="45" height="30" fill="#FAF8F5"/>
    <text x="25" y="140" fill="#FAF8F5" font-family="system-ui, sans-serif" font-size="12" font-weight="800">ГОМЕЛЬ ⇄ МИНСК</text>

    <rect x="20" y="0" width="140" height="70" rx="3" fill="url(#sl_box2)" stroke="#8C5832" stroke-width="2"/>
  </g>

  <!-- Sprinter Van at Loading Dock (Right side) -->
  <g transform="translate(800, 370)" filter="url(#sl_shadow)">
    <ellipse cx="180" cy="225" rx="200" ry="16" fill="#000" opacity="0.8"/>
    <!-- Sprinter Van Body -->
    <path d="M0 220 L0 50 L160 50 L220 100 L250 140 L250 220 Z" fill="#6B1E2D" stroke="#8B2536" stroke-width="2"/>
    <path d="M165 60 L210 100 L165 100 Z" fill="#1A2D38"/>
    <circle cx="70" cy="225" r="22" fill="#0C0A0B" stroke="#8B2536" stroke-width="4"/>
    <circle cx="190" cy="225" r="22" fill="#0C0A0B" stroke="#8B2536" stroke-width="4"/>
    <rect x="240" y="155" width="8" height="18" rx="2" fill="#FFFDF0"/>
  </g>
</svg>
