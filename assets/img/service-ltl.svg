<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Semantic Theme 2: Charcoal (Graphite / Warehouse Terminal) -->
    <linearGradient id="sl_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D10"/>
      <stop offset="45%" stop-color="#171C22"/>
      <stop offset="75%" stop-color="#262E38"/>
      <stop offset="100%" stop-color="#0C0E12"/>
    </linearGradient>
    <radialGradient id="sl_glow" cx="60%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#414D5E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0D10" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sl_grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <linearGradient id="sl_floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181C21"/>
      <stop offset="100%" stop-color="#0A0C0E"/>
    </linearGradient>
    <linearGradient id="sl_container" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28313D"/>
      <stop offset="100%" stop-color="#191F27"/>
    </linearGradient>
    <linearGradient id="sl_kraft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA7538"/>
      <stop offset="100%" stop-color="#80481F"/>
    </linearGradient>
    <filter id="sl_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Sky Canvas & Consistent Semantic Grid -->
  <rect width="1200" height="800" fill="url(#sl_bg)"/>
  <rect width="1200" height="800" fill="url(#sl_grid)"/>
  <rect width="1200" height="480" fill="url(#sl_glow)"/>

  <!-- Warehouse Terminal Background Steel Racks -->
  <g stroke="#2C3542" stroke-width="2" opacity="0.55">
    <line x1="80" y1="160" x2="1120" y2="160"/>
    <line x1="80" y1="300" x2="1120" y2="300"/>
    <line x1="180" y1="110" x2="180" y2="480"/>
    <line x1="480" y1="110" x2="480" y2="480"/>
    <line x1="780" y1="110" x2="780" y2="480"/>
    <!-- Diagonal cross-bracing in racks -->
    <line x1="180" y1="160" x2="480" y2="300" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.4"/>
    <line x1="480" y1="160" x2="180" y2="300" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.4"/>
  </g>

  <!-- Highway & Logistics Terminal Platform Surface -->
  <path d="M 0 480 L 1200 480 L 1200 800 L 0 800 Z" fill="url(#sl_floor)"/>
  <line x1="0" y1="478" x2="1200" y2="478" stroke="#526073" stroke-width="3.5"/>
  <!-- Identical Road Markings & Dashed Center Divider -->
  <path opacity="0.4" d="M 0 630 L 1200 630" stroke="#FAF8F5" stroke-width="4" stroke-dasharray="50 35"/>
  <line x1="0" y1="750" x2="1200" y2="750" stroke="#FFC048" stroke-width="3" opacity="0.45"/>

  <!-- Stacked Pallets and Consolidated Cargo Boxes -->
  <g transform="translate(260, 310)" filter="url(#sl_shadow)">
    <!-- Wooden Pallet Base -->
    <rect x="0" y="220" width="240" height="24" rx="2" fill="#422915" stroke="#7A4222" stroke-width="2"/>
    <rect x="24" y="224" width="34" height="16" fill="#1C110B"/>
    <rect x="103" y="224" width="34" height="16" fill="#1C110B"/>
    <rect x="182" y="224" width="34" height="16" fill="#1C110B"/>

    <!-- Large Cargo Container / Box 1 (Graphite Industrial Consolidation Box) -->
    <rect x="10" y="50" width="220" height="170" rx="4" fill="url(#sl_container)" stroke="#4A586B" stroke-width="2"/>
    <line x1="10" y1="105" x2="230" y2="105" stroke="#364252" stroke-width="1.5"/>
    
    <!-- White Barcode / Logistics Shipping Label -->
    <rect x="30" y="70" width="70" height="48" rx="2" fill="#FAF8F5"/>
    <line x1="42" y1="80" x2="42" y2="108" stroke="#120A0D" stroke-width="2"/>
    <line x1="48" y1="80" x2="48" y2="108" stroke="#120A0D" stroke-width="3.5"/>
    <line x1="56" y1="80" x2="56" y2="108" stroke="#120A0D" stroke-width="1.5"/>
    <line x1="64" y1="80" x2="64" y2="108" stroke="#120A0D" stroke-width="4"/>
    <line x1="74" y1="80" x2="74" y2="108" stroke="#120A0D" stroke-width="2"/>
    <line x1="82" y1="80" x2="82" y2="108" stroke="#120A0D" stroke-width="3"/>
    
    <!-- Box Typography -->
    <text x="30" y="146" fill="#FAF8F5" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="900" letter-spacing="1">LTL / СБОРНЫЙ ГРУЗ</text>
    <text x="30" y="168" fill="#8EA0B8" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">ПАРТИЯ № ASMA-8840</text>
    <text x="30" y="194" fill="#B3C5DC" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">КОНСОЛИДАЦИЯ ОТ 100 КГ</text>
  </g>

  <!-- Stacked Pallet 2 (Vibrant Warm Kraft Shipping Cartons - Pops on Charcoal) -->
  <g transform="translate(540, 340)" filter="url(#sl_shadow)">
    <!-- Wooden Pallet Base -->
    <rect x="0" y="190" width="200" height="22" rx="2" fill="#422915" stroke="#7A4222" stroke-width="2"/>
    <rect x="20" y="194" width="28" height="14" fill="#1C110B"/>
    <rect x="86" y="194" width="28" height="14" fill="#1C110B"/>
    <rect x="152" y="194" width="28" height="14" fill="#1C110B"/>
    
    <!-- Lower Kraft Box -->
    <rect x="10" y="80" width="180" height="110" rx="3" fill="url(#sl_kraft)" stroke="#D48F53" stroke-width="2"/>
    <!-- Packing Tape strip -->
    <line x1="100" y1="80" x2="100" y2="190" stroke="#7A421D" stroke-width="12" opacity="0.6"/>
    <rect x="26" y="100" width="55" height="34" rx="2" fill="#FAF8F5"/>
    <text x="26" y="152" fill="#FAF8F5" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="800">ГОМЕЛЬ ⇄ МИНСК</text>
    <text x="26" y="172" fill="#FFE2C6" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700">ДОГРУЗ / РБ</text>

    <!-- Upper Kraft Box -->
    <rect x="25" y="10" width="150" height="70" rx="3" fill="url(#sl_kraft)" stroke="#D48F53" stroke-width="2"/>
    <line x1="100" y1="10" x2="100" y2="80" stroke="#7A421D" stroke-width="10" opacity="0.6"/>
    <!-- Fragile handling mark ↑↑ -->
    <g transform="translate(42, 28)" stroke="#FAF8F5" stroke-width="1.8" fill="none">
      <line x1="4" y1="20" x2="4" y2="6"/>
      <polyline points="0,10 4,4 8,10"/>
      <line x1="14" y1="20" x2="14" y2="6"/>
      <polyline points="10,10 14,4 18,10"/>
    </g>
  </g>

  <!-- Commercial Logistics Van at Loading Dock (Right side) -->
  <g transform="translate(800, 360)" filter="url(#sl_shadow)">
    <ellipse cx="200" cy="235" rx="220" ry="18" fill="#000" opacity="0.85"/>
    <!-- Sprinter Van Body in Charcoal Steel Livery -->
    <path d="M0 230 L0 50 L170 50 L235 100 L265 145 L265 230 Z" fill="#252D37" stroke="#465466" stroke-width="2.5"/>
    <path d="M175 62 L225 102 L175 102 Z" fill="#141E26" stroke="#5A7085" stroke-width="1.2"/>
    <circle cx="75" cy="235" r="24" fill="#0A0D10" stroke="#4A5666" stroke-width="4"/>
    <circle cx="205" cy="235" r="24" fill="#0A0D10" stroke="#4A5666" stroke-width="4"/>
    <!-- Headlight glow beam -->
    <rect x="255" y="160" width="10" height="20" rx="2" fill="#FFFDF0" filter="drop-shadow(0 0 8px #FFFDF0)"/>
  </g>
</svg>
