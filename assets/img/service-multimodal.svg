<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_multi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181518"/>
      <stop offset="50%" stop-color="#261720"/>
      <stop offset="100%" stop-color="#121114"/>
    </linearGradient>
    <linearGradient id="multi_rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B2536"/>
      <stop offset="50%" stop-color="#3A4D59"/>
      <stop offset="100%" stop-color="#E6A9B4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg_multi)"/>

  <!-- Global Route Arc Grid -->
  <g opacity="0.12" stroke="#F5F1E7" stroke-width="1.5">
    <ellipse cx="640" cy="780" rx="600" ry="240" fill="none"/>
    <ellipse cx="640" cy="780" rx="420" ry="170" fill="none"/>
    <ellipse cx="640" cy="780" rx="240" ry="100" fill="none"/>
    <line x1="640" y1="100" x2="640" y2="780"/>
    <line x1="200" y1="160" x2="640" y2="780"/>
    <line x1="1080" y1="160" x2="640" y2="780"/>
  </g>

  <!-- Railroad Track Perspective (Diagonal across left) -->
  <g opacity="0.45">
    <path d="M-50 750 L380 440" stroke="#3D3638" stroke-width="8"/>
    <path d="M-10 790 L420 450" stroke="#3D3638" stroke-width="8"/>
    <!-- Sleepers / Ties -->
    <path d="M-20 740 L10 800" stroke="#63544C" stroke-width="7"/>
    <path d="M40 700 L70 760" stroke="#63544C" stroke-width="7"/>
    <path d="M100 660 L130 720" stroke="#63544C" stroke-width="7"/>
    <path d="M160 620 L190 680" stroke="#63544C" stroke-width="6"/>
    <path d="M220 580 L250 635" stroke="#63544C" stroke-width="6"/>
    <path d="M280 540 L305 590" stroke="#63544C" stroke-width="5"/>
    <path d="M335 505 L358 550" stroke="#63544C" stroke-width="5"/>
    <path d="M380 475 L400 515" stroke="#63544C" stroke-width="4"/>
  </g>

  <!-- Highway Roadway (Diagonal across right) -->
  <path d="M620 440 L1320 750 L1220 800 L560 460 Z" fill="#201C1D" stroke="#382F31" stroke-width="2"/>
  <path d="M590 450 L1270 775" stroke="#E6A9B4" stroke-width="3" stroke-dasharray="20 18" opacity="0.6"/>

  <!-- Intermodal Hub Node / Link Icons -->
  <!-- Hub Center Node -->
  <g transform="translate(520, 340)">
    <circle cx="120" cy="110" r="48" fill="#24191E" stroke="#8B2536" stroke-width="3"/>
    <circle cx="120" cy="110" r="32" fill="#8B2536"/>
    <!-- Interlocking arrows / exchange icon -->
    <path d="M106 102 L134 102 M126 94 L134 102 L126 110" stroke="#F5F1E7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M134 118 L106 118 M114 126 L106 118 L114 110" stroke="#F5F1E7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Left: Freight Rail Flatcar with Container -->
  <g transform="translate(130, 320)">
    <!-- Rail platform -->
    <rect x="0" y="150" width="300" height="14" rx="3" fill="#383032"/>
    <!-- Bogie / wheels -->
    <circle cx="50" cy="172" r="14" fill="#181516" stroke="#4F4446" stroke-width="3"/>
    <circle cx="90" cy="172" r="14" fill="#181516" stroke="#4F4446" stroke-width="3"/>
    <circle cx="210" cy="172" r="14" fill="#181516" stroke="#4F4446" stroke-width="3"/>
    <circle cx="250" cy="172" r="14" fill="#181516" stroke="#4F4446" stroke-width="3"/>
    <!-- Container -->
    <rect x="15" y="40" width="270" height="110" rx="4" fill="#3A4D59" stroke="#526A7A" stroke-width="2"/>
    <line x1="60" y1="40" x2="60" y2="150" stroke="#22303A" stroke-width="2"/>
    <line x1="120" y1="40" x2="120" y2="150" stroke="#22303A" stroke-width="2"/>
    <line x1="180" y1="40" x2="180" y2="150" stroke="#22303A" stroke-width="2"/>
    <line x1="240" y1="40" x2="240" y2="150" stroke="#22303A" stroke-width="2"/>
    <text x="35" y="70" fill="#E6A9B4" font-family="monospace" font-size="12" font-weight="700">RAIL FREIGHT</text>
  </g>

  <!-- Right: Road Truck Vector -->
  <g transform="translate(740, 320)">
    <!-- Trailer -->
    <rect x="0" y="40" width="220" height="110" rx="4" fill="#8B2536" stroke="#B83A4E" stroke-width="2"/>
    <text x="25" y="70" fill="#F5F1E7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ROAD FREIGHT</text>
    <!-- Cab -->
    <path d="M225 60 L280 60 Q305 60 315 90 L325 125 L325 150 L225 150 Z" fill="#2E2829" stroke="#4F4446" stroke-width="1.5"/>
    <!-- Wheels -->
    <circle cx="40" cy="162" r="14" fill="#181516" stroke="#4F4446" stroke-width="3"/>
    <circle cx="80" cy="162" r="14" fill="#181516" stroke="#4F4446" stroke-width="3"/>
    <circle cx="250" cy="162" r="14" fill="#181516" stroke="#4F4446" stroke-width="3"/>
    <circle cx="295" cy="162" r="14" fill="#181516" stroke="#4F4446" stroke-width="3"/>
  </g>

  <!-- Animated-like Pulsing Connecting Arc -->
  <path d="M290 350 Q640 180 880 350" fill="none" stroke="url(#multi_rail)" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="460" cy="245" r="5" fill="#E6A9B4"/>
  <circle cx="700" cy="240" r="5" fill="#8B2536"/>

  <!-- Vector Route Indicator Badge -->
  <g transform="translate(900, 100)">
    <rect width="280" height="92" rx="14" fill="#231C1E" stroke="#4A2A30" stroke-width="1.5"/>
    <circle cx="34" cy="35" r="8" fill="#8B2536"/>
    <circle cx="34" cy="35" r="4" fill="#F5F1E7"/>
    <line x1="34" y1="45" x2="34" y2="57" stroke="#E6A9B4" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="34" cy="65" r="5" fill="#E6A9B4"/>
    <text x="56" y="39" fill="#F5F1E7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">МУЛЬТИМОДАЛЬНО</text>
    <text x="56" y="62" fill="#E6A9B4" font-family="system-ui, -apple-system, sans-serif" font-size="12">Авто + Ж/Д связка · Единый тариф</text>
  </g>
</svg>
