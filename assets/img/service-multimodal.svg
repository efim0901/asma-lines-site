<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sm_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E080B"/>
      <stop offset="45%" stop-color="#280C16"/>
      <stop offset="85%" stop-color="#481423"/>
      <stop offset="100%" stop-color="#10080B"/>
    </linearGradient>
    <linearGradient id="sm_ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20181D"/>
      <stop offset="100%" stop-color="#0B0709"/>
    </linearGradient>
    <filter id="sm_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sm_bg)"/>

  <!-- Network Map Matrix & Connecting Vector Splines -->
  <g opacity="0.45" stroke="#E6A9B4" stroke-width="2">
    <path d="M 200 360 Q 450 200 700 360 T 1100 320" fill="none" stroke="#FF2E50" stroke-width="3" stroke-dasharray="10 6"/>
    <line x1="200" y1="360" x2="450" y2="480" stroke="#FFC048" stroke-dasharray="6 4"/>
    <line x1="450" y1="480" x2="700" y2="360" stroke="#FFC048" stroke-dasharray="6 4"/>
    <line x1="700" y1="360" x2="950" y2="480" stroke="#FFC048" stroke-dasharray="6 4"/>
  </g>

  <!-- Node 1: Auto Transport Hub (Truck) -->
  <g transform="translate(200, 360)" filter="url(#sm_shadow)">
    <circle cx="0" cy="0" r="50" fill="#180E13" stroke="#8B2536" stroke-width="3"/>
    <circle cx="0" cy="0" r="42" fill="#2B121A"/>
    <!-- Truck Icon -->
    <rect x="-24" y="-12" width="32" height="22" rx="2" fill="#FAF8F5"/>
    <path d="M8 -12 L18 -12 L24 -2 L24 10 L8 10 Z" fill="#FF2E50"/>
    <circle cx="-12" cy="12" r="5" fill="#0E080B"/>
    <circle cx="16" cy="12" r="5" fill="#0E080B"/>
    <text x="-48" y="70" fill="#FAF8F5" font-family="system-ui, sans-serif" font-size="13" font-weight="800">АВТОТРАНСПОРТ</text>
  </g>

  <!-- Node 2: Rail Transport Hub (Train Engine) -->
  <g transform="translate(700, 360)" filter="url(#sm_shadow)">
    <circle cx="0" cy="0" r="55" fill="#180E13" stroke="#FF2E50" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="46" fill="#6B1E2D"/>
    <!-- Locomotive Icon -->
    <rect x="-26" y="-16" width="52" height="26" rx="3" fill="#FAF8F5"/>
    <rect x="-18" y="-8" width="14" height="10" fill="#180E13"/>
    <rect x="4" y="-8" width="14" height="10" fill="#180E13"/>
    <circle cx="-16" cy="14" r="6" fill="#FFC048"/>
    <circle cx="0" cy="14" r="6" fill="#FFC048"/>
    <circle cx="16" cy="14" r="6" fill="#FFC048"/>
    <text x="-52" y="75" fill="#FAF8F5" font-family="system-ui, sans-serif" font-size="13" font-weight="900" letter-spacing="1">Ж/Д МАРШРУТЫ</text>
  </g>

  <!-- Node 3: Sea / Container Terminal (Ship) -->
  <g transform="translate(1050, 320)" filter="url(#sm_shadow)">
    <circle cx="0" cy="0" r="48" fill="#180E13" stroke="#FFC048" stroke-width="3"/>
    <circle cx="0" cy="0" r="40" fill="#243844"/>
    <!-- Vessel Icon -->
    <path d="M-24 4 L24 4 L18 16 L-18 16 Z" fill="#FAF8F5"/>
    <rect x="-14" y="-14" width="28" height="16" fill="#FF2E50"/>
    <text x="-54" y="68" fill="#FAF8F5" font-family="system-ui, sans-serif" font-size="13" font-weight="800">КОНТЕЙНЕРЫ</text>
  </g>

  <!-- Ground Corridor Surface -->
  <path d="M 0 540 L 1200 540 L 1200 800 L 0 800 Z" fill="url(#sm_ground)"/>
  <line x1="0" y1="538" x2="1200" y2="538" stroke="#8B2536" stroke-width="4"/>
  <path d="M 0 670 L 1200 670" stroke="#FAF8F5" stroke-width="4" stroke-dasharray="50 35" opacity="0.4"/>
</svg>
