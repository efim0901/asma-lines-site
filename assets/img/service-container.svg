<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_cont" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19191B"/>
      <stop offset="50%" stop-color="#241B22"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="burgundy_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B2536"/>
      <stop offset="100%" stop-color="#55141E"/>
    </linearGradient>
    <linearGradient id="blue_cont_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4D59"/>
      <stop offset="100%" stop-color="#22303A"/>
    </linearGradient>
    <linearGradient id="sand_cont_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A7A6E"/>
      <stop offset="100%" stop-color="#594B42"/>
    </linearGradient>
    <pattern id="cont_ribs" width="18" height="100" patternUnits="userSpaceOnUse">
      <line x1="2" y1="0" x2="2" y2="100" stroke="#000" stroke-width="2.5" opacity="0.4"/>
      <line x1="16" y1="0" x2="16" y2="100" stroke="#FFF" stroke-width="1" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#bg_cont)"/>

  <!-- Terminal Grid & Cranes Perspective -->
  <g opacity="0.08" stroke="#F5F1E7" stroke-width="1">
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="660" x2="1280" y2="660"/>
    <line x1="0" y1="740" x2="1280" y2="740"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/>
  </g>

  <!-- Gantry Crane Outline (Industrial Terminal aesthetic) -->
  <g opacity="0.25" stroke="#E6A9B4" stroke-width="2">
    <!-- Left Crane Leg -->
    <line x1="140" y1="120" x2="80" y2="580"/>
    <line x1="180" y1="120" x2="150" y2="580"/>
    <line x1="80" y1="580" x2="150" y2="580"/>
    <!-- Bracing -->
    <line x1="140" y1="180" x2="155" y2="280"/>
    <line x1="170" y1="180" x2="110" y2="280"/>
    <line x1="110" y1="280" x2="140" y2="400"/>
    <line x1="150" y1="280" x2="95" y2="400"/>
    <!-- Top Girder -->
    <rect x="120" y="90" width="860" height="34" rx="4" fill="none"/>
    <line x1="120" y1="107" x2="980" y2="107" stroke-dasharray="10 10"/>
    <!-- Spreader / Hoist Cables -->
    <line x1="560" y1="124" x2="560" y2="280" stroke-width="1.5"/>
    <line x1="720" y1="124" x2="720" y2="280" stroke-width="1.5"/>
    <!-- Spreader Beam -->
    <rect x="540" y="280" width="200" height="16" fill="#8B2536" stroke="#E6A9B4" stroke-width="1.5"/>
  </g>

  <!-- Ground Platform / Asphalt -->
  <rect y="580" width="1280" height="220" fill="#141315"/>
  <line x1="0" y1="580" x2="1280" y2="580" stroke="#332D30" stroke-width="3"/>

  <!-- Stacked Intermodal Containers -->
  <!-- Container 1 (Blue bottom-left, 40ft) -->
  <g transform="translate(180, 420)">
    <rect width="420" height="150" rx="8" fill="url(#blue_cont_grad)" stroke="#4A5F6D" stroke-width="2"/>
    <rect width="420" height="150" fill="url(#cont_ribs)"/>
    <!-- Corner Castings -->
    <rect x="6" y="6" width="18" height="18" rx="3" fill="#152026"/>
    <rect x="396" y="6" width="18" height="18" rx="3" fill="#152026"/>
    <rect x="6" y="126" width="18" height="18" rx="3" fill="#152026"/>
    <rect x="396" y="126" width="18" height="18" rx="3" fill="#152026"/>
    <!-- Marking code -->
    <text x="32" y="44" fill="#A4B7C4" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">MSKU 819204 45G1</text>
  </g>

  <!-- Container 2 (Sand / Khaki bottom-right, 40ft) -->
  <g transform="translate(630, 420)">
    <rect width="450" height="150" rx="8" fill="url(#sand_cont_grad)" stroke="#6E5E53" stroke-width="2"/>
    <rect width="450" height="150" fill="url(#cont_ribs)"/>
    <rect x="6" y="6" width="18" height="18" rx="3" fill="#241E1A"/>
    <rect x="426" y="6" width="18" height="18" rx="3" fill="#241E1A"/>
    <rect x="6" y="126" width="18" height="18" rx="3" fill="#241E1A"/>
    <rect x="426" y="126" width="18" height="18" rx="3" fill="#241E1A"/>
    <text x="32" y="44" fill="#C9BDB3" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">CMAU 472190 42G1</text>
  </g>

  <!-- Container 3 (Top ASMA Burgundy container lifted or stacked) -->
  <g transform="translate(380, 250)">
    <rect width="480" height="155" rx="8" fill="url(#burgundy_grad)" stroke="#B83A4E" stroke-width="2"/>
    <rect width="480" height="155" fill="url(#cont_ribs)"/>
    <rect x="6" y="6" width="20" height="20" rx="3" fill="#3D0C13"/>
    <rect x="454" y="6" width="20" height="20" rx="3" fill="#3D0C13"/>
    <rect x="6" y="129" width="20" height="20" rx="3" fill="#3D0C13"/>
    <rect x="454" y="129" width="20" height="20" rx="3" fill="#3D0C13"/>
    <!-- Brand Stencil -->
    <rect x="36" y="32" width="240" height="34" rx="4" fill="#3D0C13" opacity="0.6"/>
    <text x="48" y="55" fill="#F5F1E7" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="4">ASMA LINES</text>
    <text x="310" y="54" fill="#E6A9B4" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">ASMA 202609 22G1</text>
    <text x="48" y="105" fill="#E6A9B4" font-family="sans-serif" font-size="12" opacity="0.8">MAX. GROSS  30,480 KG</text>
    <text x="48" y="125" fill="#E6A9B4" font-family="sans-serif" font-size="12" opacity="0.8">PAYLOAD     28,250 KG</text>
  </g>

  <!-- Vector Route Indicator Badge -->
  <g transform="translate(900, 100)">
    <rect width="280" height="92" rx="14" fill="#231C1E" stroke="#4A2A30" stroke-width="1.5"/>
    <circle cx="34" cy="35" r="8" fill="#8B2536"/>
    <circle cx="34" cy="35" r="4" fill="#F5F1E7"/>
    <line x1="34" y1="45" x2="34" y2="57" stroke="#E6A9B4" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="34" cy="65" r="5" fill="#E6A9B4"/>
    <text x="56" y="39" fill="#F5F1E7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">КОНТЕЙНЕРЫ</text>
    <text x="56" y="62" fill="#E6A9B4" font-family="system-ui, -apple-system, sans-serif" font-size="12">20' &amp; 40' DC / HC · Терминалы</text>
  </g>
</svg>
