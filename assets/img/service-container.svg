<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sc_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F090B"/>
      <stop offset="45%" stop-color="#2B0E1B"/>
      <stop offset="85%" stop-color="#4E1525"/>
      <stop offset="100%" stop-color="#12080C"/>
    </linearGradient>
    <linearGradient id="sc_road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20181C"/>
      <stop offset="100%" stop-color="#0A0608"/>
    </linearGradient>
    <linearGradient id="sc_cont_red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B1E2D"/>
      <stop offset="50%" stop-color="#8B2536"/>
      <stop offset="100%" stop-color="#4E1521"/>
    </linearGradient>
    <linearGradient id="sc_cont_blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#243844"/>
      <stop offset="50%" stop-color="#3A5666"/>
      <stop offset="100%" stop-color="#1B2A34"/>
    </linearGradient>
    <filter id="sc_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sc_bg)"/>

  <!-- Port Terminal Crane Silhouette -->
  <g fill="#1A1215" opacity="0.6">
    <path d="M 150 480 L 180 200 L 220 200 L 250 480 Z"/>
    <path d="M 120 220 L 450 180 L 450 200 L 120 240 Z"/>
    <rect x="320" y="200" width="10" height="120"/>
  </g>

  <!-- Highway Surface -->
  <path d="M 0 480 L 1200 480 L 1200 800 L 0 800 Z" fill="url(#sc_road)"/>
  <line x1="0" y1="478" x2="1200" y2="478" stroke="#8B2536" stroke-width="4"/>
  <path d="M 0 630 L 1200 630" stroke="#FAF8F5" stroke-width="4" stroke-dasharray="50 35" opacity="0.4"/>
  <line x1="0" y1="750" x2="1200" y2="750" stroke="#FFC048" stroke-width="3" opacity="0.45"/>

  <!-- Heavy Container Truck (40ft ISO Container) -->
  <g transform="translate(480, 310)" filter="url(#sc_shadow)">
    <!-- Shadow -->
    <ellipse cx="300" cy="265" rx="360" ry="22" fill="#000" opacity="0.85"/>

    <!-- Chassis Frame -->
    <rect x="0" y="210" width="450" height="20" rx="3" fill="#120D0F" stroke="#3D2E36" stroke-width="2"/>

    <!-- 40ft ISO Shipping Container (Burgundy Red) -->
    <rect x="20" y="30" width="410" height="180" rx="4" fill="url(#sc_cont_red)" stroke="#A83248" stroke-width="2.5"/>
    
    <!-- Corrugated Wall Ribs -->
    <line x1="60" y1="30" x2="60" y2="210" stroke="#4E1521" stroke-width="2"/>
    <line x1="100" y1="30" x2="100" y2="210" stroke="#4E1521" stroke-width="2"/>
    <line x1="140" y1="30" x2="140" y2="210" stroke="#4E1521" stroke-width="2"/>
    <line x1="180" y1="30" x2="180" y2="210" stroke="#4E1521" stroke-width="2"/>
    <line x1="220" y1="30" x2="220" y2="210" stroke="#4E1521" stroke-width="2"/>
    <line x1="260" y1="30" x2="260" y2="210" stroke="#4E1521" stroke-width="2"/>
    <line x1="300" y1="30" x2="300" y2="210" stroke="#4E1521" stroke-width="2"/>
    <line x1="340" y1="30" x2="340" y2="210" stroke="#4E1521" stroke-width="2"/>
    <line x1="380" y1="30" x2="380" y2="210" stroke="#4E1521" stroke-width="2"/>

    <!-- ISO Corner Castings & Locking Locks -->
    <rect x="20" y="30" width="16" height="16" fill="#2D0D14" stroke="#FAF8F5" stroke-width="1.5"/>
    <rect x="414" y="30" width="16" height="16" fill="#2D0D14" stroke="#FAF8F5" stroke-width="1.5"/>
    <rect x="20" y="194" width="16" height="16" fill="#2D0D14" stroke="#FAF8F5" stroke-width="1.5"/>
    <rect x="414" y="194" width="16" height="16" fill="#2D0D14" stroke="#FAF8F5" stroke-width="1.5"/>

    <!-- Container Branding -->
    <text x="60" y="95" fill="#FAF8F5" font-family="system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="3">ASMA CONTAINER</text>
    <text x="60" y="115" fill="#FFC048" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">40FT HIGH CUBE · ISO 22G1</text>

    <!-- Wheels -->
    <g>
      <circle cx="280" cy="240" r="22" fill="#0C0A0B" stroke="#523E48" stroke-width="4"/>
      <circle cx="335" cy="240" r="22" fill="#0C0A0B" stroke="#523E48" stroke-width="4"/>
      <circle cx="390" cy="240" r="22" fill="#0C0A0B" stroke="#523E48" stroke-width="4"/>
    </g>

    <!-- Tractor Cab -->
    <path d="M430 240 L430 110 L455 75 L530 75 L555 115 L555 240 Z" fill="#243844" stroke="#3A5666" stroke-width="2"/>
    <path d="M475 82 L525 82 L545 115 L475 115 Z" fill="#141E26"/>
    <circle cx="490" cy="250" r="22" fill="#0C0A0B" stroke="#3A5666" stroke-width="4"/>
    <rect x="545" y="175" width="10" height="20" rx="2" fill="#FFFDF0"/>
  </g>
</svg>
