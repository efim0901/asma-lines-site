<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ca_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D080A"/>
      <stop offset="40%" stop-color="#260C16"/>
      <stop offset="75%" stop-color="#441322"/>
      <stop offset="100%" stop-color="#10080B"/>
    </linearGradient>
    <radialGradient id="ca_glow" cx="65%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#8B2536" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0D080A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ca_road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22191E"/>
      <stop offset="100%" stop-color="#0C080A"/>
    </linearGradient>
    <pattern id="ca_grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.3" fill="#E6A9B4" fill-opacity="0.16"/>
    </pattern>
    <filter id="ca_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1920" height="1080" fill="url(#ca_sky)"/>
  <rect width="1920" height="1080" fill="url(#ca_grid)"/>
  <rect width="1920" height="1080" fill="url(#ca_glow)"/>

  <!-- Route Distance Vector Lines (Minsk to Gomel path preview) -->
  <g opacity="0.45" stroke="#E6A9B4" stroke-width="1.8">
    <path d="M 500 380 Q 850 280 1350 440" fill="none" stroke="#FF2E50" stroke-width="2.5" stroke-dasharray="10 6"/>
    <line x1="500" y1="380" x2="1350" y2="440" stroke="#FFC048" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Origin Pin (Gomel) -->
  <g transform="translate(1350, 440)" filter="url(#ca_shadow)">
    <circle cx="0" cy="0" r="26" fill="#0D080A" stroke="#8B2536" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#FF2E50"/>
    <path d="M0 -34 L12 -60 A14 14 0 1 0 -12 -60 Z" fill="#6B1E2D" stroke="#8B2536" stroke-width="2"/>
    <circle cx="0" cy="-60" r="5" fill="#FAF8F5"/>
    <text x="-32" y="-76" fill="#FAF8F5" font-family="system-ui, sans-serif" font-size="13" font-weight="900" letter-spacing="1">ГОМЕЛЬ (СТАРТ)</text>
  </g>

  <!-- Destination Pin (Minsk) -->
  <g transform="translate(500, 380)" filter="url(#ca_shadow)">
    <circle cx="0" cy="0" r="20" fill="#0D080A" stroke="#FFC048" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="7" fill="#FFC048"/>
    <path d="M0 -26 L10 -48 A11 11 0 1 0 -10 -48 Z" fill="#FFC048"/>
    <circle cx="0" cy="-48" r="4" fill="#0D080A"/>
    <text x="-26" y="-62" fill="#FAF8F5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">МИНСК (310 КМ)</text>
  </g>

  <!-- Highway Ground Surface -->
  <path d="M 0 630 L 1920 630 L 1920 1080 L 0 1080 Z" fill="url(#ca_road)"/>
  <line x1="0" y1="628" x2="1920" y2="628" stroke="#8B2536" stroke-width="4"/>

  <!-- Road Markings -->
  <path d="M 0 810 L 1920 810" stroke="#FAF8F5" stroke-width="4" stroke-dasharray="65 40" opacity="0.4"/>
  <line x1="0" y1="970" x2="1920" y2="970" stroke="#FFC048" stroke-width="3" opacity="0.45"/>

  <!-- Delivery Van / Truck Icon driving along highway -->
  <g transform="translate(860, 480)" filter="url(#ca_shadow)">
    <!-- Shadow -->
    <ellipse cx="280" cy="260" rx="350" ry="20" fill="#000000" opacity="0.8"/>
    <!-- Headlight beam -->
    <polygon points="460,190 920,120 920,300 460,230" fill="#FFF8E0" fill-opacity="0.45"/>

    <!-- Truck Box -->
    <rect x="0" y="30" width="340" height="180" rx="6" fill="#241B20" stroke="#4C3A44" stroke-width="2.5"/>
    <text x="35" y="95" fill="#FAF8F5" font-family="system-ui, sans-serif" font-size="24" font-weight="900" letter-spacing="3">ASMA LINES</text>
    <text x="35" y="115" fill="#E6A9B4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">РАССЧЁТ СТОИМОСТИ</text>

    <!-- Wheels -->
    <circle cx="230" cy="230" r="22" fill="#0C0A0B" stroke="#523E48" stroke-width="4"/>
    <circle cx="285" cy="230" r="22" fill="#0C0A0B" stroke="#523E48" stroke-width="4"/>

    <!-- Cab -->
    <path d="M350 230 L350 95 L375 60 L465 60 L485 100 L485 230 Z" fill="#6B1E2D" stroke="#8B2536" stroke-width="2"/>
    <path d="M405 70 L460 70 L478 100 L405 100 Z" fill="#1A2D38" stroke="#486272" stroke-width="1.5"/>
    <circle cx="400" cy="242" r="22" fill="#0C0A0B" stroke="#8B2536" stroke-width="4"/>
    <rect x="478" y="170" width="10" height="20" rx="2" fill="#FFFDF0"/>
  </g>
</svg>
