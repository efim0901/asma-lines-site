<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="calc_sky_c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A0D"/>
      <stop offset="40%" stop-color="#2D121B"/>
      <stop offset="70%" stop-color="#4F1A28"/>
      <stop offset="100%" stop-color="#14090D"/>
    </linearGradient>
    <pattern id="calc_dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#E6A9B4" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#calc_sky_c)"/>
  <rect width="1920" height="1080" fill="url(#calc_dots)"/>

  <!-- Centered Interactive Route Pin and Distance Metric (Visible on mobile) -->
  <g transform="translate(960, 410)">
    <circle cx="0" cy="0" r="280" stroke="#8B2536" stroke-width="2" stroke-dasharray="10 8" fill="none"/>
    <circle cx="0" cy="0" r="180" stroke="#E6A9B4" stroke-width="1.5" fill="none" opacity="0.6"/>
    <line x1="-360" y1="0" x2="360" y2="0" stroke="#8B2536" stroke-width="2"/>
    
    <!-- Origin Pin -->
    <g transform="translate(-160, -40)">
      <path d="M0 -30 C-18 -30 -30 -18 -30 0 C-30 22 0 50 0 50 C0 50 30 22 30 0 C30 -18 18 -30 0 -30 Z" fill="#8B2536" stroke="#E6A9B4" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#FFF"/>
      <text x="0" y="72" text-anchor="middle" fill="#F8F7EF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ГОМЕЛЬ</text>
    </g>

    <!-- Destination Pin -->
    <g transform="translate(160, -40)">
      <path d="M0 -30 C-18 -30 -30 -18 -30 0 C-30 22 0 50 0 50 C0 50 30 22 30 0 C30 -18 18 -30 0 -30 Z" fill="#FFC048" stroke="#FFF" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#140A0D"/>
      <text x="0" y="72" text-anchor="middle" fill="#FFC048" font-family="system-ui, sans-serif" font-size="13" font-weight="700">БЕЛАРУСЬ</text>
    </g>

    <!-- Route Arc -->
    <path d="M -160 -40 Q 0 -140 160 -40" fill="none" stroke="#FF2E50" stroke-width="4" stroke-dasharray="8 6"/>
  </g>

  <!-- Highway Ground -->
  <path d="M 0 660 Q 960 620 1920 580 L 1920 1080 L 0 1080 Z" fill="#151013"/>
  <path d="M 0 660 Q 960 620 1920 580" stroke="#8B2536" stroke-width="4"/>
  <path d="M 0 820 Q 960 780 1920 740" stroke="#E6A9B4" stroke-width="4" stroke-dasharray="50 35" opacity="0.45"/>
</svg>
