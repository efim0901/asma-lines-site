<svg width="1920" height="800" viewBox="0 0 1920 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rail_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161214"/>
      <stop offset="50%" stop-color="#24171E"/>
      <stop offset="100%" stop-color="#121012"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="800" fill="url(#rail_bg)"/>

  <!-- Global Multi-hub Vector Network -->
  <g opacity="0.12" stroke="#F8F7EF" stroke-width="1.5">
    <circle cx="960" cy="400" r="280" fill="none"/>
    <circle cx="960" cy="400" r="460" fill="none"/>
    <circle cx="960" cy="400" r="640" fill="none"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="300" y1="0" x2="1620" y2="800"/>
    <line x1="300" y1="800" x2="1620" y2="0"/>
  </g>

  <!-- Railroad Track & Sleeper Perspective -->
  <g opacity="0.6">
    <path d="M400 800 L880 440" stroke="#3D3437" stroke-width="8"/>
    <path d="M460 800 L910 440" stroke="#3D3437" stroke-width="8"/>
    <!-- Sleepers -->
    <path d="M380 790 L480 790" stroke="#665248" stroke-width="7"/>
    <path d="M440 730 L530 730" stroke="#665248" stroke-width="7"/>
    <path d="M500 670 L585 670" stroke="#665248" stroke-width="6"/>
    <path d="M560 615 L640 615" stroke="#665248" stroke-width="6"/>
    <path d="M620 565 L690 565" stroke="#665248" stroke-width="5"/>
    <path d="M680 520 L745 520" stroke="#665248" stroke-width="5"/>
    <path d="M740 480 L800 480" stroke="#665248" stroke-width="4"/>
    <path d="M800 445 L850 445" stroke="#665248" stroke-width="4"/>
  </g>

  <!-- Highway Roadway on the Right -->
  <polygon points="1060,440 1100,440 1600,800 1480,800" fill="#1C181A"/>
  <path d="M1080 440 L1540 800" stroke="#E6A9B4" stroke-width="3" stroke-dasharray="16 14" opacity="0.6"/>

  <!-- Transport Nodes -->
  <g transform="translate(930, 370)">
    <circle cx="30" cy="30" r="32" fill="#241419" stroke="#8B2536" stroke-width="3"/>
    <circle cx="30" cy="30" r="16" fill="#8B2536"/>
    <!-- Central Node Pulse -->
    <circle cx="30" cy="30" r="50" fill="none" stroke="#E6A9B4" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  </g>
</svg>
