<svg width="1920" height="900" viewBox="0 0 1920 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rail_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120D10"/>
      <stop offset="50%" stop-color="#24141D"/>
      <stop offset="100%" stop-color="#140F13"/>
    </linearGradient>
    <linearGradient id="train_cab_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A4D59"/>
      <stop offset="60%" stop-color="#4E6778"/>
      <stop offset="100%" stop-color="#28353D"/>
    </linearGradient>
    <linearGradient id="cont_red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B2536"/>
      <stop offset="100%" stop-color="#551520"/>
    </linearGradient>
    <linearGradient id="cont_blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#364954"/>
      <stop offset="100%" stop-color="#1E2B33"/>
    </linearGradient>
    <pattern id="rail_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.5" fill="#F8F7EF" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1920" height="900" fill="url(#rail_sky)"/>
  <rect width="1920" height="900" fill="url(#rail_grid)"/>

  <!-- Global Route Arc & Geometry Network (Centered) -->
  <g opacity="0.3" stroke="#E6A9B4" stroke-width="1.5">
    <ellipse cx="960" cy="450" rx="550" ry="260" fill="none" stroke-dasharray="8 6"/>
    <ellipse cx="960" cy="450" rx="850" ry="400" fill="none"/>
    <line x1="0" y1="450" x2="1920" y2="450" stroke="#8B2536" stroke-width="2"/>
  </g>

  <!-- Centered Transport Nodes on Orbit -->
  <g transform="translate(620, 240)">
    <circle cx="0" cy="0" r="24" fill="#1C1318" stroke="#8B2536" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#FFC048"/>
    <text x="-36" y="-34" fill="#F8F7EF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">МИНСК HUB</text>
  </g>
  <g transform="translate(960, 210)">
    <circle cx="0" cy="0" r="26" fill="#1C1318" stroke="#8B2536" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#FF2E50"/>
    <text x="-48" y="-34" fill="#F8F7EF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">ГОМЕЛЬ TERMINAL</text>
  </g>
  <g transform="translate(1300, 240)">
    <circle cx="0" cy="0" r="24" fill="#1C1318" stroke="#3A4D59" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#E6A9B4"/>
    <text x="24" y="5" fill="#E6A9B4" font-family="system-ui, sans-serif" font-size="13">ТРАНЗИТ ЕАЭС</text>
  </g>

  <!-- Elevated Logistics Highway Bridge (Upper Deck) -->
  <path d="M 0 360 L 1920 330 L 1920 400 L 0 430 Z" fill="#1C181B"/>
  <line x1="0" y1="360" x2="1920" y2="330" stroke="#4A3B43" stroke-width="4"/>
  <line x1="0" y1="400" x2="1920" y2="370" stroke="#E6A9B4" stroke-width="2" stroke-dasharray="40 30" opacity="0.4"/>

  <!-- Ground Multi-Track Railway Perspective (Lower Deck) -->
  <rect y="580" width="1920" height="320" fill="#110E10"/>
  <line x1="0" y1="580" x2="1920" y2="580" stroke="#3D2933" stroke-width="4"/>
  <line x1="0" y1="730" x2="1920" y2="730" stroke="#5C5156" stroke-width="6"/>
  <line x1="0" y1="760" x2="1920" y2="760" stroke="#5C5156" stroke-width="6"/>

  <!-- Railway Sleepers -->
  <g stroke="#382E33" stroke-width="10">
    <line x1="160" y1="715" x2="160" y2="775"/>
    <line x1="320" y1="715" x2="320" y2="775"/>
    <line x1="480" y1="715" x2="480" y2="775"/>
    <line x1="640" y1="715" x2="640" y2="775"/>
    <line x1="800" y1="715" x2="800" y2="775"/>
    <line x1="960" y1="715" x2="960" y2="775"/>
    <line x1="1120" y1="715" x2="1120" y2="775"/>
    <line x1="1280" y1="715" x2="1280" y2="775"/>
    <line x1="1440" y1="715" x2="1440" y2="775"/>
    <line x1="1600" y1="715" x2="1600" y2="775"/>
    <line x1="1760" y1="715" x2="1760" y2="775"/>
  </g>

  <!-- Centered Train Composition: Flatcar with ASMA Burgundy Container + Locomotive (spanning x=540 to 1340, centered at 960) -->
  <!-- Container Flatcar (Left-Center) -->
  <g transform="translate(560, 520)">
    <rect x="0" y="160" width="340" height="24" rx="3" fill="#241E22" stroke="#473B43" stroke-width="2"/>
    <!-- Burgundy Container -->
    <rect x="15" y="10" width="310" height="150" rx="4" fill="url(#cont_red)" stroke="#C73E54" stroke-width="2"/>
    <line x1="75" y1="10" x2="75" y2="160" stroke="#50121D" stroke-width="2"/>
    <line x1="135" y1="10" x2="135" y2="160" stroke="#50121D" stroke-width="2"/>
    <line x1="195" y1="10" x2="195" y2="160" stroke="#50121D" stroke-width="2"/>
    <line x1="255" y1="10" x2="255" y2="160" stroke="#50121D" stroke-width="2"/>
    <text x="35" y="60" fill="#F8F7EF" font-family="system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="4">ASMA LINES</text>
    <text x="35" y="85" fill="#E6A9B4" font-family="system-ui, monospace" font-size="12" font-weight="700">INTERMODAL FREIGHT</text>
    <!-- Wheels -->
    <circle cx="50" cy="205" r="22" fill="#0C0A0B" stroke="#4D3E47" stroke-width="4"/>
    <circle cx="100" cy="205" r="22" fill="#0C0A0B" stroke="#4D3E47" stroke-width="4"/>
    <circle cx="240" cy="205" r="22" fill="#0C0A0B" stroke="#4D3E47" stroke-width="4"/>
    <circle cx="290" cy="205" r="22" fill="#0C0A0B" stroke="#4D3E47" stroke-width="4"/>
  </g>

  <!-- Heavy Freight Locomotive (Center-Right) -->
  <g transform="translate(930, 470)">
    <!-- Loco Body -->
    <path d="M 0 210 L 0 50 L 260 50 L 320 90 L 350 150 L 350 210 Z" fill="url(#train_cab_grad)" stroke="#6C8699" stroke-width="2.5"/>
    <path d="M 0 20 L 240 20 L 270 50 L 0 50 Z" fill="#202A30"/>
    <!-- Cab Window -->
    <path d="M 255 58 L 305 92 L 320 135 L 255 135 Z" fill="#131B20" stroke="#435866" stroke-width="2"/>
    <line x1="265" y1="65" x2="310" y2="125" stroke="#FFF" stroke-width="1.5" opacity="0.4"/>
    <!-- Yellow Warning Band -->
    <rect x="0" y="160" width="350" height="20" fill="#FFC048"/>
    <!-- Headlight Beam -->
    <circle cx="340" cy="140" r="10" fill="#FFF2D1"/>
    <polygon points="345,135 680,80 680,280 345,155" fill="#FFF2D1" fill-opacity="0.35"/>
    <!-- Locomotive Wheels -->
    <rect x="-10" y="210" width="370" height="25" rx="3" fill="#1A1518" stroke="#382E34" stroke-width="2"/>
    <circle cx="40" cy="255" r="24" fill="#0C0A0B" stroke="#4D3E47" stroke-width="4"/>
    <circle cx="100" cy="255" r="24" fill="#0C0A0B" stroke="#4D3E47" stroke-width="4"/>
    <circle cx="160" cy="255" r="24" fill="#0C0A0B" stroke="#4D3E47" stroke-width="4"/>
    <circle cx="240" cy="255" r="24" fill="#0C0A0B" stroke="#4D3E47" stroke-width="4"/>
    <circle cx="300" cy="255" r="24" fill="#0C0A0B" stroke="#4D3E47" stroke-width="4"/>
  </g>
</svg>
