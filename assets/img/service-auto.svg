<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="srv_sky_c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A0D"/>
      <stop offset="40%" stop-color="#2E121B"/>
      <stop offset="70%" stop-color="#4F1A28"/>
      <stop offset="100%" stop-color="#14090D"/>
    </linearGradient>
    <pattern id="srv_dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#E6A9B4" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="srv_beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#FFD382" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8B2536" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#srv_sky_c)"/>
  <rect width="1920" height="1080" fill="url(#srv_dots)"/>

  <!-- Centered Route Constellation -->
  <g transform="translate(960, 420)" opacity="0.4">
    <circle cx="0" cy="0" r="340" stroke="#8B2536" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="0" r="220" stroke="#E6A9B4" stroke-width="2" stroke-dasharray="10 8" fill="none"/>
    <line x1="-380" y1="0" x2="380" y2="0" stroke="#8B2536" stroke-width="2"/>
    <line x1="0" y1="-380" x2="0" y2="380" stroke="#8B2536" stroke-width="2"/>
    <circle cx="160" cy="-120" r="14" fill="#FFC048"/>
    <circle cx="-180" cy="100" r="14" fill="#FF2E50"/>
  </g>

  <!-- Highway Surface -->
  <path d="M 0 640 L 1920 640 L 1920 1080 L 0 1080 Z" fill="#151013"/>
  <line x1="0" y1="638" x2="1920" y2="638" stroke="#8B2536" stroke-width="4"/>
  <line x1="0" y1="840" x2="1920" y2="840" stroke="#E6A9B4" stroke-width="4" stroke-dasharray="60 40" opacity="0.45"/>
  <line x1="0" y1="990" x2="1920" y2="990" stroke="#FFC048" stroke-width="3" opacity="0.35"/>

  <!-- Centered Logistics Truck (ASMA Auto Services) -->
  <g transform="translate(660, 470)">
    <polygon points="560,225 1100,150 1100,340 560,270" fill="url(#srv_beam)" opacity="0.6"/>
    <ellipse cx="320" cy="285" rx="400" ry="24" fill="#030203" opacity="0.9"/>

    <rect x="0" y="30" width="420" height="210" rx="6" fill="#241E22" stroke="#4D3F47" stroke-width="2.5"/>
    <rect x="25" y="60" width="370" height="80" rx="4" fill="#130D10" stroke="#8B2536" stroke-width="2"/>
    <text x="45" y="108" fill="#F8F7EF" font-family="system-ui, sans-serif" font-size="30" font-weight="900" letter-spacing="5">ASMA LINES</text>
    <text x="46" y="126" fill="#E6A9B4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3">АВТОМОБИЛЬНЫЕ ПЕРЕВОЗКИ</text>

    <!-- Wheels -->
    <circle cx="280" cy="265" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="340" cy="265" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="400" cy="265" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>

    <!-- Cab -->
    <path d="M425 78 L500 75 L540 105 L570 160 L575 235 L575 265 L425 265 Z" fill="#8B2536" stroke="#E6A9B4" stroke-width="2"/>
    <path d="M495 82 L535 108 L555 152 L495 152 Z" fill="#18222A" stroke="#3A4D5C" stroke-width="2"/>
    <circle cx="565" cy="200" r="6" fill="#FFF8E0"/>
    <circle cx="565" cy="200" r="14" fill="#FFC048" fill-opacity="0.5"/>
    <circle cx="475" cy="265" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="550" cy="265" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
  </g>
</svg>
