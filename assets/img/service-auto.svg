<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_auto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1718"/>
      <stop offset="50%" stop-color="#2D171C"/>
      <stop offset="100%" stop-color="#151214"/>
    </linearGradient>
    <linearGradient id="road_auto" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#221E20"/>
      <stop offset="100%" stop-color="#0E0D0E"/>
    </linearGradient>
    <linearGradient id="brand_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B2536"/>
      <stop offset="100%" stop-color="#B83A4E"/>
    </linearGradient>
    <linearGradient id="cab_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E2829"/>
      <stop offset="100%" stop-color="#181516"/>
    </linearGradient>
    <filter id="glow_auto" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="800" fill="url(#bg_auto)"/>

  <!-- Subtle Blueprint / Grid Lines -->
  <g opacity="0.07" stroke="#F5F1E7" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="256" y1="0" x2="256" y2="800"/>
    <line x1="512" y1="0" x2="512" y2="800"/>
    <line x1="768" y1="0" x2="768" y2="800"/>
    <line x1="1024" y1="0" x2="1024" y2="800"/>
  </g>

  <!-- Highway Perspective -->
  <path d="M0 800 L460 480 L820 480 L1280 800 Z" fill="url(#road_auto)"/>
  <path d="M632 480 L648 480 L652 800 L628 800 Z" fill="#F5F1E7" opacity="0.12"/>
  <line x1="640" y1="500" x2="640" y2="540" stroke="#E6A9B4" stroke-width="3" stroke-dasharray="16 16" opacity="0.6"/>
  <line x1="640" y1="570" x2="640" y2="640" stroke="#E6A9B4" stroke-width="5" stroke-dasharray="24 20" opacity="0.75"/>
  <line x1="640" y1="680" x2="640" y2="790" stroke="#E6A9B4" stroke-width="7" opacity="0.9"/>

  <!-- Stylized Modern Truck (Semi-Trailer) Silhouette -->
  <g transform="translate(240, 220)">
    <!-- Trailer Shadow -->
    <rect x="18" y="325" width="760" height="25" rx="10" fill="#0A090A" opacity="0.7"/>

    <!-- Trailer Body -->
    <rect x="20" y="70" width="530" height="250" rx="12" fill="#231F20" stroke="#3D3436" stroke-width="2"/>
    <!-- Trailer Ribs / Curtainsider Texture -->
    <g opacity="0.2" stroke="#F5F1E7" stroke-width="1.5">
      <line x1="90" y1="70" x2="90" y2="320"/>
      <line x1="160" y1="70" x2="160" y2="320"/>
      <line x1="230" y1="70" x2="230" y2="320"/>
      <line x1="300" y1="70" x2="300" y2="320"/>
      <line x1="370" y1="70" x2="370" y2="320"/>
      <line x1="440" y1="70" x2="440" y2="320"/>
      <line x1="510" y1="70" x2="510" y2="320"/>
    </g>

    <!-- ASMA Brand Stripe on Trailer -->
    <rect x="20" y="240" width="530" height="34" fill="url(#brand_grad)"/>
    <text x="50" y="263" fill="#F5F1E7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4">ASMA LINES · FREIGHT LOGISTICS</text>

    <!-- Aerodynamic Truck Cab -->
    <path d="M555 110 L680 110 Q730 110 745 155 L770 230 Q780 260 780 280 L780 320 L555 320 Z" fill="url(#cab_grad)" stroke="#4A3D40" stroke-width="2"/>
    <!-- Windshield -->
    <path d="M670 125 L735 155 Q745 175 750 205 L665 205 Z" fill="#3D4B57" opacity="0.6"/>
    <!-- Side Window -->
    <path d="M605 135 L650 135 L650 205 L595 205 Z" fill="#2E3A44" opacity="0.7"/>
    <!-- Cab Air Deflector & Grille -->
    <line x1="710" y1="245" x2="770" y2="245" stroke="#8B2536" stroke-width="3"/>
    <line x1="715" y1="260" x2="772" y2="260" stroke="#8B2536" stroke-width="3"/>
    <line x1="720" y1="275" x2="770" y2="275" stroke="#8B2536" stroke-width="3"/>

    <!-- Headlight Beam (Vector Glow) -->
    <path d="M780 270 L980 230 L1020 340 L780 300 Z" fill="url(#brand_grad)" opacity="0.18" filter="url(#glow_auto)"/>
    <circle cx="778" cy="285" r="7" fill="#F5F1E7" opacity="0.9"/>

    <!-- Wheels (Double axle trailer + drive axles) -->
    <!-- Trailer Wheels -->
    <g fill="#141213" stroke="#453B3D" stroke-width="4">
      <circle cx="95" cy="325" r="28"/>
      <circle cx="95" cy="325" r="14" fill="#262123" stroke="#8B2536" stroke-width="2"/>
      <circle cx="165" cy="325" r="28"/>
      <circle cx="165" cy="325" r="14" fill="#262123" stroke="#8B2536" stroke-width="2"/>
      <circle cx="235" cy="325" r="28"/>
      <circle cx="235" cy="325" r="14" fill="#262123" stroke="#8B2536" stroke-width="2"/>

      <!-- Tractor Wheels -->
      <circle cx="585" cy="325" r="28"/>
      <circle cx="585" cy="325" r="14" fill="#262123" stroke="#8B2536" stroke-width="2"/>
      <circle cx="715" cy="325" r="28"/>
      <circle cx="715" cy="325" r="14" fill="#262123" stroke="#8B2536" stroke-width="2"/>
    </g>
  </g>

  <!-- Vector Route Indicator Badge -->
  <g transform="translate(900, 100)">
    <rect width="280" height="92" rx="14" fill="#231C1E" stroke="#4A2A30" stroke-width="1.5"/>
    <circle cx="34" cy="35" r="8" fill="#8B2536"/>
    <circle cx="34" cy="35" r="4" fill="#F5F1E7"/>
    <line x1="34" y1="45" x2="34" y2="57" stroke="#E6A9B4" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="34" cy="65" r="5" fill="#E6A9B4"/>
    <text x="56" y="39" fill="#F5F1E7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">АВТОТРАНСПОРТ</text>
    <text x="56" y="62" fill="#E6A9B4" font-family="system-ui, -apple-system, sans-serif" font-size="12">Тенты · Рефы · До 20 тонн</text>
  </g>
</svg>
