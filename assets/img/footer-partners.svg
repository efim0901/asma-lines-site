<svg width="1920" height="800" viewBox="0 0 1920 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fp_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090507"/>
      <stop offset="40%" stop-color="#1E0C17"/>
      <stop offset="75%" stop-color="#3B1220"/>
      <stop offset="100%" stop-color="#0B0508"/>
    </linearGradient>
    <radialGradient id="fp_glow" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8B2536" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#090507" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fp_road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1318"/>
      <stop offset="100%" stop-color="#080507"/>
    </linearGradient>
    <linearGradient id="fp_beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFDF0" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFE0A0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B2536" stop-opacity="0"/>
    </linearGradient>
    <filter id="fp_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1920" height="800" fill="url(#fp_sky)"/>
  <rect width="1920" height="800" fill="url(#fp_glow)"/>

  <!-- Partner Logistics Hub & Route Network in background -->
  <g opacity="0.2">
    <rect x="680" y="140" width="340" height="150" rx="4" stroke="#FFD382" stroke-width="1.2" stroke-dasharray="6 6"/>
    <text x="710" y="180" fill="#FFD382" font-family="sans-serif" font-size="16" font-weight="700">ТЕРМИНАЛ ЗАГРУЗКИ / ПОГРУЗОЧНЫЙ ДОК</text>
    <text x="710" y="210" fill="#E6A9B4" font-family="sans-serif" font-size="14" font-weight="600">Оплата: 3–5 банковских дней · 100% гарантия</text>
    <line x1="710" y1="230" x2="980" y2="230" stroke="#FFD382" stroke-width="1"/>
    <text x="710" y="255" fill="#FAF8F5" font-family="sans-serif" font-size="13">Кругорейсы: Минск · Гомель · Брест · Москва</text>
  </g>

  <!-- Highway Surface -->
  <path d="M 0 450 L 1920 450 L 1920 800 L 0 800 Z" fill="url(#fp_road)"/>
  <line x1="0" y1="448" x2="1920" y2="448" stroke="#8B2536" stroke-width="4"/>

  <!-- Road Dividers -->
  <path d="M 0 620 L 1920 620" stroke="#FAF8F5" stroke-width="4" stroke-dasharray="70 45" opacity="0.38"/>
  <line x1="0" y1="740" x2="1920" y2="740" stroke="#FFC048" stroke-width="3" opacity="0.45"/>

  <!-- Benchmark Truck (Right Side) -->
  <g transform="translate(1040, 280)" filter="url(#fp_shadow)">
    <!-- Volumetric Headlight Cone -->
    <polygon points="690,250 1380,160 1380,380 690,300" fill="url(#fp_beam)" opacity="0.6"/>

    <!-- Truck Shadow -->
    <ellipse cx="380" cy="315" rx="460" ry="24" fill="#000000" opacity="0.88"/>

    <!-- Semi-Trailer Box -->
    <rect x="0" y="30" width="500" height="240" rx="8" fill="#1F171D" stroke="#46343F" stroke-width="3"/>
    <rect x="35" y="60" width="430" height="90" rx="6" fill="#120A0E" stroke="#8B2536" stroke-width="2"/>
    <text x="60" y="112" fill="#FAF8F5" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="4">ASMA LINES</text>
    <text x="60" y="134" fill="#FFD382" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">ПЕРЕВОЗЧИКАМ · КРУГОРЕЙСЫ И БЫСТРАЯ ОПЛАТА</text>

    <!-- Side Skirt -->
    <rect x="50" y="235" width="260" height="32" rx="4" fill="#2B2028" stroke="#483742" stroke-width="1.5"/>
    <line x1="60" y1="251" x2="300" y2="251" stroke="#FFD382" stroke-width="2" opacity="0.6"/>

    <!-- Wheels -->
    <g>
      <circle cx="340" cy="290" r="26" fill="#0A0809" stroke="#524049" stroke-width="5"/>
      <circle cx="400" cy="290" r="26" fill="#0A0809" stroke="#524049" stroke-width="5"/>
      <circle cx="460" cy="290" r="26" fill="#0A0809" stroke="#524049" stroke-width="5"/>
      <circle cx="340" cy="290" r="8" fill="#FFD382" opacity="0.6"/>
      <circle cx="400" cy="290" r="8" fill="#FFD382" opacity="0.6"/>
      <circle cx="460" cy="290" r="8" fill="#FFD382" opacity="0.6"/>
    </g>

    <!-- Tractor Cab -->
    <path d="M495 270 L495 120 L530 80 L660 80 L695 130 L695 270 Z" fill="#6B1E2D" stroke="#8B2536" stroke-width="2"/>
    <path d="M575 92 L655 92 L680 135 L575 135 Z" fill="#182A36" stroke="#4A6575" stroke-width="2"/>
    <line x1="505" y1="180" x2="685" y2="180" stroke="#FFD382" stroke-width="2.5"/>

    <!-- Front Wheels -->
    <circle cx="560" cy="290" r="28" fill="#0A0809" stroke="#682230" stroke-width="6"/>
    <circle cx="650" cy="290" r="28" fill="#0A0809" stroke="#682230" stroke-width="6"/>
    <circle cx="560" cy="290" r="9" fill="#FFD382" opacity="0.7"/>
    <circle cx="650" cy="290" r="9" fill="#FFD382" opacity="0.7"/>

    <!-- Headlight Unit -->
    <rect x="682" y="215" width="12" height="26" rx="3" fill="#FFFDF0"/>
  </g>
</svg>
