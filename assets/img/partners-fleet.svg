<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fleet_sky_c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A0D"/>
      <stop offset="45%" stop-color="#2E121B"/>
      <stop offset="75%" stop-color="#4F1A29"/>
      <stop offset="100%" stop-color="#14090D"/>
    </linearGradient>
    <pattern id="fleet_dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#E6A9B4" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="beam_c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFD699" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B2536" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#fleet_sky_c)"/>
  <rect width="1920" height="1080" fill="url(#fleet_dots)"/>

  <!-- Centered Logistics Network Radar / Telemetry Grid -->
  <g transform="translate(960, 420)" opacity="0.35">
    <circle cx="0" cy="0" r="320" stroke="#8B2536" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="0" r="210" stroke="#E6A9B4" stroke-width="2" stroke-dasharray="10 8" fill="none"/>
    <line x1="-360" y1="0" x2="360" y2="0" stroke="#8B2536" stroke-width="2"/>
    <line x1="0" y1="-360" x2="0" y2="360" stroke="#8B2536" stroke-width="2"/>
  </g>

  <!-- Logistics Terminal Ground -->
  <rect y="620" width="1920" height="460" fill="#151013"/>
  <line x1="0" y1="620" x2="1920" y2="620" stroke="#8B2536" stroke-width="4"/>
  <line x1="0" y1="820" x2="1920" y2="820" stroke="#E6A9B4" stroke-width="3" stroke-dasharray="50 30" opacity="0.45"/>

  <!-- Centered Partner Fleet Trucks Composition (Spans perfectly in center for mobile) -->
  <!-- Center Main Hero Truck (ASMA Lines burgundy) -->
  <g transform="translate(700, 440)">
    <!-- Headlight beam -->
    <polygon points="490,195 980,120 980,310 490,250" fill="url(#beam_c)" opacity="0.55"/>
    <ellipse cx="260" cy="270" rx="340" ry="24" fill="#030203" opacity="0.9"/>
    
    <!-- Trailer -->
    <rect x="0" y="30" width="360" height="195" rx="6" fill="#241E22" stroke="#4B3D45" stroke-width="2.5"/>
    <rect x="25" y="60" width="310" height="75" rx="4" fill="#130D10" stroke="#8B2536" stroke-width="2"/>
    <text x="45" y="105" fill="#F8F7EF" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="4">ASMA PARTNER</text>
    <text x="46" y="123" fill="#E6A9B4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">СЕТЬ ПЕРЕВОЗЧИКОВ · БЕЛАРУСЬ</text>
    
    <!-- Wheels -->
    <circle cx="230" cy="245" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="290" cy="245" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="350" cy="245" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    
    <!-- Tractor Cab -->
    <path d="M365 75 L440 70 L478 100 L505 155 L510 220 L510 245 L365 245 Z" fill="#8B2536" stroke="#E6A9B4" stroke-width="2"/>
    <path d="M435 78 L475 102 L495 148 L435 148 Z" fill="#18222A" stroke="#3A4D5C" stroke-width="2"/>
    <circle cx="500" cy="190" r="6" fill="#FFF8E0"/>
    <circle cx="500" cy="190" r="14" fill="#FFC048" fill-opacity="0.45"/>
    <circle cx="410" cy="245" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="485" cy="245" r="24" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
  </g>

  <!-- Left Fleet Refrigerator Truck -->
  <g transform="translate(200, 480)" opacity="0.85">
    <rect x="0" y="30" width="300" height="170" rx="4" fill="#2C343D" stroke="#4D5A68" stroke-width="2"/>
    <rect x="20" y="10" width="80" height="20" rx="3" fill="#697B8C"/>
    <text x="30" y="90" fill="#E1E9F0" font-family="sans-serif" font-size="14" font-weight="800">РЕФРИЖЕРАТОР</text>
    <path d="M305 85 L370 80 L400 110 L415 160 L415 220 L305 220 Z" fill="#3D4B59" stroke="#697B8C" stroke-width="2"/>
    <circle cx="210" cy="225" r="22" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="270" cy="225" r="22" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="380" cy="225" r="22" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
  </g>

  <!-- Right Fleet Container Truck -->
  <g transform="translate(1360, 490)" opacity="0.85">
    <rect x="0" y="25" width="280" height="155" rx="4" fill="#5A1A25" stroke="#9E253B" stroke-width="2"/>
    <text x="25" y="75" fill="#F8F7EF" font-family="sans-serif" font-size="14" font-weight="800">КОНТЕЙНЕРОВОЗ</text>
    <path d="M285 75 L350 70 L380 100 L395 150 L395 205 L285 205 Z" fill="#241E22" stroke="#4D3F47" stroke-width="2"/>
    <circle cx="200" cy="210" r="22" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="260" cy="210" r="22" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
    <circle cx="360" cy="210" r="22" fill="#0C0A0B" stroke="#4D3F47" stroke-width="4"/>
  </g>
</svg>
