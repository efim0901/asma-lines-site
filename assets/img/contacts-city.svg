<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cnt_sky_c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A0D"/>
      <stop offset="40%" stop-color="#2D121B"/>
      <stop offset="70%" stop-color="#4F1A28"/>
      <stop offset="100%" stop-color="#14090D"/>
    </linearGradient>
    <pattern id="cnt_dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#E6A9B4" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#cnt_sky_c)"/>
  <rect width="1920" height="1080" fill="url(#cnt_dots)"/>

  <!-- Centered Gomel Logistics Hub & Communications Waves (Visible on mobile) -->
  <g transform="translate(960, 410)">
    <circle cx="0" cy="0" r="300" stroke="#8B2536" stroke-width="2" stroke-dasharray="10 8" fill="none"/>
    <circle cx="0" cy="0" r="200" stroke="#E6A9B4" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="0" cy="0" r="100" stroke="#FFC048" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.6"/>
    
    <!-- Pulse Waves -->
    <circle cx="0" cy="0" r="35" fill="#8B2536" stroke="#E6A9B4" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="#FFF"/>

    <text x="0" y="65" text-anchor="middle" fill="#F8F7EF" font-family="system-ui, sans-serif" font-size="16" font-weight="900" letter-spacing="2">ГОМЕЛЬ · ASMA HQ</text>
    <text x="0" y="88" text-anchor="middle" fill="#E6A9B4" font-family="system-ui, sans-serif" font-size="12">ТЕЛЕМЕТРИЯ И СВЯЗЬ</text>
  </g>

  <!-- Highway Ground -->
  <path d="M 0 660 Q 960 620 1920 580 L 1920 1080 L 0 1080 Z" fill="#151013"/>
  <path d="M 0 660 Q 960 620 1920 580" stroke="#8B2536" stroke-width="4"/>
  <path d="M 0 820 Q 960 780 1920 740" stroke="#E6A9B4" stroke-width="4" stroke-dasharray="50 35" opacity="0.45"/>
</svg>
