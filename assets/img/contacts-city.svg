<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="city_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181114"/>
      <stop offset="60%" stop-color="#2B151D"/>
      <stop offset="100%" stop-color="#140E10"/>
    </linearGradient>
    <linearGradient id="office_bldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34242A"/>
      <stop offset="100%" stop-color="#1A1316"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#city_sky)"/>

  <!-- Geometric Architectural Silhouettes (Gomel Urban Hub) -->
  <!-- Far Skyline -->
  <g opacity="0.35">
    <rect x="200" y="320" width="160" height="420" fill="#241B20"/>
    <rect x="380" y="260" width="220" height="480" fill="#291F24"/>
    <rect x="620" y="380" width="180" height="360" fill="#241B20"/>
    <rect x="820" y="220" width="260" height="520" fill="#2F2128"/>
    <rect x="1100" y="340" width="200" height="400" fill="#251B21"/>
    <rect x="1320" y="280" width="240" height="460" fill="#2B1F25"/>
    <rect x="1580" y="360" width="180" height="380" fill="#241B20"/>
  </g>

  <!-- Mid Skyline with Illuminated Windows -->
  <g>
    <!-- Tower 1 -->
    <rect x="280" y="420" width="200" height="420" rx="4" fill="url(#office_bldg)" stroke="#4A343D" stroke-width="2"/>
    <!-- Windows grid -->
    <g fill="#FFEAA7" opacity="0.4">
      <rect x="305" y="450" width="18" height="12" rx="2"/>
      <rect x="335" y="450" width="18" height="12" rx="2"/>
      <rect x="395" y="450" width="18" height="12" rx="2"/>
      <rect x="425" y="450" width="18" height="12" rx="2"/>
      <rect x="305" y="480" width="18" height="12" rx="2"/>
      <rect x="365" y="480" width="18" height="12" rx="2"/>
      <rect x="425" y="480" width="18" height="12" rx="2"/>
      <rect x="335" y="510" width="18" height="12" rx="2"/>
      <rect x="395" y="510" width="18" height="12" rx="2"/>
      <rect x="305" y="540" width="18" height="12" rx="2"/>
      <rect x="365" y="540" width="18" height="12" rx="2"/>
    </g>

    <!-- Tower 2 (Main Headquarters style) -->
    <rect x="740" y="340" width="340" height="500" rx="6" fill="#2C1B22" stroke="#682535" stroke-width="2"/>
    <!-- Window rows -->
    <g fill="#E6A9B4" opacity="0.35">
      <rect x="770" y="370" width="32" height="16" rx="2"/>
      <rect x="820" y="370" width="32" height="16" rx="2"/>
      <rect x="870" y="370" width="32" height="16" rx="2"/>
      <rect x="920" y="370" width="32" height="16" rx="2"/>
      <rect x="970" y="370" width="32" height="16" rx="2"/>
      <rect x="1020" y="370" width="32" height="16" rx="2"/>
      <!-- Row 2 -->
      <rect x="770" y="410" width="32" height="16" rx="2" fill="#FFEAA7" opacity="0.8"/>
      <rect x="820" y="410" width="32" height="16" rx="2"/>
      <rect x="920" y="410" width="32" height="16" rx="2" fill="#FFEAA7" opacity="0.8"/>
      <rect x="970" y="410" width="32" height="16" rx="2"/>
      <!-- Row 3 -->
      <rect x="820" y="450" width="32" height="16" rx="2"/>
      <rect x="870" y="450" width="32" height="16" rx="2" fill="#FFEAA7" opacity="0.8"/>
      <rect x="1020" y="450" width="32" height="16" rx="2"/>
      <!-- Row 4 -->
      <rect x="770" y="490" width="32" height="16" rx="2"/>
      <rect x="920" y="490" width="32" height="16" rx="2"/>
      <rect x="970" y="490" width="32" height="16" rx="2" fill="#FFEAA7" opacity="0.8"/>
    </g>

    <!-- Tower 3 -->
    <rect x="1240" y="400" width="240" height="440" rx="4" fill="url(#office_bldg)" stroke="#4A343D" stroke-width="2"/>
    <g fill="#FFEAA7" opacity="0.4">
      <rect x="1270" y="430" width="24" height="14" rx="2"/>
      <rect x="1310" y="430" width="24" height="14" rx="2"/>
      <rect x="1390" y="430" width="24" height="14" rx="2"/>
      <rect x="1270" y="470" width="24" height="14" rx="2"/>
      <rect x="1350" y="470" width="24" height="14" rx="2"/>
      <rect x="1430" y="470" width="24" height="14" rx="2"/>
    </g>
  </g>

  <!-- Ground Plaza & Communications Node -->
  <rect y="740" width="1920" height="340" fill="#130F11"/>
  <line x1="0" y1="740" x2="1920" y2="740" stroke="#3D2930" stroke-width="3"/>

  <!-- Connectivity Network Lines (Digital Logistics Dispatch) -->
  <g stroke="#E6A9B4" opacity="0.25" stroke-width="1.5">
    <line x1="910" y1="340" x2="480" y2="740"/>
    <line x1="910" y1="340" x2="1360" y2="740"/>
    <line x1="910" y1="340" x2="910" y2="180"/>
    <circle cx="910" cy="180" r="10" fill="#8B2536"/>
    <circle cx="910" cy="180" r="4" fill="#F8F7EF"/>
  </g>

  <!-- Location Pin Badge -->
  <g transform="translate(1500, 100)">
    <rect width="320" height="90" rx="12" fill="#1C1316" stroke="#4D202A" stroke-width="2"/>
    <circle cx="36" cy="35" r="8" fill="#8B2536"/>
    <circle cx="36" cy="35" r="4" fill="#F8F7EF"/>
    <text x="60" y="39" fill="#F8F7EF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">ОФИС И ДИСПЕТЧЕР</text>
    <text x="60" y="63" fill="#E6A9B4" font-family="system-ui, sans-serif" font-size="12">г. Гомель · Связь 24/7</text>
  </g>
</svg>
