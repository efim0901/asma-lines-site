<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faq_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181114"/>
      <stop offset="50%" stop-color="#28141B"/>
      <stop offset="100%" stop-color="#120E10"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#faq_sky)"/>

  <!-- Documentation & Dispatch Checklist Vectors -->
  <g opacity="0.15" stroke="#F8F7EF" stroke-width="1.5">
    <rect x="300" y="240" width="380" height="520" rx="8" fill="none"/>
    <line x1="340" y1="320" x2="600" y2="320"/>
    <line x1="340" y1="380" x2="560" y2="380"/>
    <line x1="340" y1="440" x2="620" y2="440"/>
    <line x1="340" y1="500" x2="520" y2="500"/>
    <line x1="340" y1="560" x2="580" y2="560"/>

    <circle cx="370" cy="320" r="10" fill="#8B2536"/>
    <circle cx="370" cy="440" r="10" fill="#8B2536"/>
    <circle cx="370" cy="560" r="10" fill="#8B2536"/>
  </g>

  <!-- Route Checkpoint Milestone Nodes -->
  <g transform="translate(1000, 360)">
    <line x1="0" y1="120" x2="600" y2="120" stroke="#8B2536" stroke-width="4"/>
    
    <!-- Point 1 -->
    <circle cx="80" cy="120" r="28" fill="#1C1316" stroke="#8B2536" stroke-width="3"/>
    <text x="73" y="128" fill="#F8F7EF" font-family="sans-serif" font-size="20" font-weight="800">1</text>
    <text x="35" y="180" fill="#E6A9B4" font-family="sans-serif" font-size="14" font-weight="600">Заявка</text>

    <!-- Point 2 -->
    <circle cx="280" cy="120" r="28" fill="#1C1316" stroke="#8B2536" stroke-width="3"/>
    <text x="272" y="128" fill="#F8F7EF" font-family="sans-serif" font-size="20" font-weight="800">2</text>
    <text x="235" y="180" fill="#E6A9B4" font-family="sans-serif" font-size="14" font-weight="600">Подача</text>

    <!-- Point 3 -->
    <circle cx="480" cy="120" r="28" fill="#8B2536" stroke="#E6A9B4" stroke-width="3"/>
    <text x="472" y="128" fill="#F8F7EF" font-family="sans-serif" font-size="20" font-weight="800">3</text>
    <text x="435" y="180" fill="#F8F7EF" font-family="sans-serif" font-size="14" font-weight="700">Выгрузка</text>
  </g>

  <g transform="translate(1500, 100)">
    <rect width="320" height="90" rx="12" fill="#1C1316" stroke="#4D202A" stroke-width="2"/>
    <circle cx="36" cy="35" r="8" fill="#8B2536"/>
    <circle cx="36" cy="35" r="4" fill="#F8F7EF"/>
    <text x="60" y="39" fill="#F8F7EF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">ОТВЕТЫ НА ВОПРОСЫ</text>
    <text x="60" y="63" fill="#E6A9B4" font-family="system-ui, sans-serif" font-size="12">Договор · Сроки · Документы</text>
  </g>
</svg>
